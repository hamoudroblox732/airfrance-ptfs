<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AirFrance PTFS - Employee Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
background:#080b10;
color:#fff;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:#111720;
border:1px solid #293646;
border-radius:20px;
padding:25px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}

h1{
margin:0;
font-size:27px;
}

.sub{
margin-top:7px;
color:#8e9aaa;
font-size:14px;
}

label{
display:block;
margin-top:20px;
margin-bottom:7px;
font-size:14px;
color:#aab5c4;
}

input{
width:100%;
padding:14px;
border-radius:11px;
border:1px solid #303d4d;
background:#0a0e14;
color:#fff;
outline:none;
font-size:15px;
}

input:focus{
border-color:#1769ff;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:11px;
background:#1769ff;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#message{
display:none;
margin-top:15px;
padding:12px;
border-radius:10px;
background:#24151a;
color:#ffb5c0;
font-size:14px;
}

.footer{
margin-top:20px;
text-align:center;
font-size:12px;
color:#667386;
}
</style>
</head>

<body>

<div class="box">

<h1>AirFrance PTFS</h1>

<div class="sub">
Employee Login
</div>

<label for="username">
Roblox Username
</label>

<input
id="username"
type="text"
placeholder="Roblox Username"
autocomplete="off"
>

<label for="employeeId">
Employee ID
</label>

<input
id="employeeId"
type="text"
placeholder="Employee ID"
autocomplete="off"
>

<button id="loginButton" onclick="login()">
Login
</button>

<div id="message"></div>

<div class="footer">
HAMOUD • AirFrance PTFS
</div>

</div>

<script>

const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";

const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const OWNER_USERNAME="Ahmad_roblox2222";
const OWNER_ID="AF-OWNER-4827";

function showError(text){

const message=document.getElementById("message");

message.textContent=text;
message.style.display="block";

}

function clearError(){

const message=document.getElementById("message");

message.textContent="";
message.style.display="none";

}

async function login(){

clearError();

const username=document
.getElementById("username")
.value
.trim();

const employeeId=document
.getElementById("employeeId")
.value
.trim();

const button=document.getElementById("loginButton");

if(!username || !employeeId){

showError("اكتب Roblox Username و Employee ID.");

return;

}

button.disabled=true;
button.textContent="Checking...";

try{

if(
username.toLowerCase()===OWNER_USERNAME.toLowerCase() &&
employeeId===OWNER_ID
){

sessionStorage.setItem("af_user",OWNER_USERNAME);
sessionStorage.setItem("af_id",OWNER_ID);
sessionStorage.setItem("af_role","Owner");

window.location.href="owner.html";

return;

}

const {data,error}=await db
.from("employees")
.select("*")
.ilike("username",username)
.eq("employee_id",employeeId)
.maybeSingle();

if(error){

showError("حدث خطأ أثناء الاتصال بقاعدة البيانات.");

console.error(error);

return;

}

if(!data){

showError("لم يتم العثور على هوية مطابقة.");

return;

}

sessionStorage.setItem("af_user",data.username);
sessionStorage.setItem("af_id",data.employee_id);
sessionStorage.setItem("af_role",data.role);

window.location.href="staff.html";

}catch(error){

showError("تعذر الاتصال. حاول مرة أخرى.");

console.error(error);

}finally{

button.disabled=false;
button.textContent="Login";

}

}

document
.getElementById("employeeId")
.addEventListener("keydown",function(event){

if(event.key==="Enter"){

login();

}

});

</script>

</body>
</html>
