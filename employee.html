<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirFrance PTFS - Employee</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #18202b 0%, #080b10 48%, #040507 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 450px;
            background: #10141a;
            border: 1px solid #252c35;
            border-radius: 22px;
            padding: 32px 25px;
            box-shadow: 0 25px 70px rgba(0,0,0,.55);
        }

        .brand {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
        }

        .sub {
            text-align: center;
            color: #8994a2;
            font-size: 13px;
            margin-top: 7px;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: #172033;
            color: #76a3ff;
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 11px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 21px;
            margin-bottom: 9px;
        }

        .description {
            color: #8e98a5;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .label {
            display: block;
            color: #c8ced7;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: #090d12;
            border: 1px solid #303944;
            color: white;
            border-radius: 11px;
            padding: 14px;
            outline: none;
            font-size: 14px;
            direction: ltr;
            text-align: left;
            margin-bottom: 12px;
        }

        input:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        input:focus:not(:disabled) {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 11px;
            padding: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .locked {
            background: #202731;
            color: #687381;
            cursor: not-allowed;
        }

        .enabled {
            background: #2563eb;
            color: white;
        }

        .status {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #171d25;
            color: #b4becb;
            font-size: 13px;
            line-height: 1.6;
        }

        .employee-section {
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid #252c35;
        }

        .back {
            margin-top: 12px;
            background: #171c23;
            color: #c8ced7;
            border: 1px solid #303944;
        }

        .footer {
            text-align: center;
            margin-top: 27px;
            color: #586270;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="panel">

    <div class="brand">
        AirFrance PTFS
    </div>

    <div class="sub">
        Employee Portal
    </div>

    <span class="badge">
        EMPLOYEE VERIFICATION
    </span>

    <h1>
        تسجيل دخول الموظف
    </h1>

    <div class="description">
        تحقق من اسم حساب Roblox أولًا، وبعدها أدخل هويتك الوظيفية.
    </div>

    <label class="label">
        حط يوزرك روبلوكس
    </label>

    <input
        id="robloxUsername"
        type="text"
        placeholder="Roblox Username"
        autocomplete="off"
        maxlength="20">

    <button
        id="usernameButton"
        class="primary"
        onclick="verifyUsername()">
        تحقق اليوزر
    </button>

    <div id="status" class="status"></div>

    <div class="employee-section">

        <label class="label">
            الهوية الوظيفية
        </label>

        <input
            id="employeeId"
            type="text"
            placeholder="AF-HQ-0001"
            autocomplete="off"
            disabled>

        <button
            id="employeeButton"
            class="locked"
            onclick="verifyEmployee()"
            disabled>
            تحقق من الهوية
        </button>

    </div>

    <button
        class="back"
        onclick="goBack()">
        رجوع
    </button>

    <div class="footer">
        HAMOUD • AirFrance PTFS
    </div>

</div>

<script>
    let usernameVerified = false;

    function verifyUsername() {

        const username =
            document.getElementById("robloxUsername")
            .value
            .trim();

        const status =
            document.getElementById("status");

        const employeeId =
            document.getElementById("employeeId");

        const employeeButton =
            document.getElementById("employeeButton");

        if (!username) {
            status.style.display = "block";
            status.textContent =
                "اكتب يوزرك روبلوكس أولًا.";
            return;
        }

        if (username !== "Ahmad_roblox2222") {
            status.style.display = "block";
            status.textContent =
                "هذا اليوزر غير مسجل كـ Owner في النظام.";

            usernameVerified = false;
            employeeId.disabled = true;
            employeeButton.disabled = true;
            employeeButton.className = "locked";

            return;
        }

        usernameVerified = true;

        status.style.display = "block";
        status.textContent =
            "تم التحقق من اليوزر. يمكنك الآن إدخال الهوية.";

        employeeId.disabled = false;
        employeeButton.disabled = false;
        employeeButton.className = "enabled";
    }

    function verifyEmployee() {

        if (!usernameVerified) {
            return;
        }

        const employeeId =
            document.getElementById("employeeId")
            .value
            .trim()
            .toUpperCase();

        const status =
            document.getElementById("status");

        if (!employeeId) {
            status.style.display = "block";
            status.textContent =
                "اكتب الهوية الوظيفية أولًا.";
            return;
        }

        if (employeeId !== "AF-HQ-0001") {
            status.style.display = "block";
            status.textContent =
                "الهوية الوظيفية غير صحيحة.";
            return;
        }

        status.style.display = "block";
        status.textContent =
            "تم التحقق. جاري فتح لوحة Owner...";

        setTimeout(function() {
            window.location.href = "owner.html";
        }, 700);
    }

    function goBack() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
