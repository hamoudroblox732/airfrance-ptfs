<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirFrance PTFS - Employee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #18202b, #080b10 48%, #040507);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .panel {
            width: 100%;
            max-width: 450px;
            background: #10141a;
            border: 1px solid #252c35;
            border-radius: 22px;
            padding: 32px 25px;
            box-shadow: 0 25px 70px rgba(0,0,0,.55);
        }
        .brand {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
        }
        .sub {
            text-align: center;
            color: #8994a2;
            font-size: 13px;
            margin-top: 7px;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background: #172033;
            color: #76a3ff;
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 11px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 21px;
            margin-bottom: 9px;
        }
        .description {
            color: #8e98a5;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 22px;
        }
        .row {
            display: flex;
            direction: ltr;
            gap: 8px;
        }
        input {
            flex: 1;
            min-width: 0;
            background: #090d12;
            border: 1px solid #303944;
            color: white;
            border-radius: 11px;
            padding: 14px;
            outline: none;
            font-size: 14px;
        }
        input:focus {
            border-color: #2563eb;
        }
        .verify {
            border: 0;
            border-radius: 11px;
            padding: 0 17px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .status {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #171d25;
            color: #b4becb;
            font-size: 13px;
        }
        .back {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border-radius: 11px;
            border: 1px solid #303944;
            background: #171c23;
            color: #c8ced7;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            margin-top: 27px;
            color: #586270;
            font-size: 11px;
        }
    </style>
</head>
<body>
<div class="panel">
    <div class="brand">AirFrance PTFS</div>
    <div class="sub">
        Employee Portal
    </div>
    <span class="badge">
        EMPLOYEE VERIFICATION
    </span>
    <h1>
        تسجيل دخول الموظف
    </h1>
    <div class="description">
        أدخل رقم الهوية الوظيفية الصادر من إدارة
        AirFrance PTFS ثم اضغط تحقق.
    </div>
    <div class="row">
        <input
            id="employeeId"
            type="text"
            placeholder="AF-PILOT-0001"
            autocomplete="off">
        <button class="verify" onclick="verifyId()">
            تحقق
        </button>
    </div>
    <div id="status" class="status"></div>
    <button class="back" onclick="goBack()">
        رجوع
    </button>
    <div class="footer">
        HAMOUD • AirFrance PTFS
    </div>
</div>
<script>
    function verifyId() {
        const input = document.getElementById("employeeId");
        const status = document.getElementById("status");
        const id = input.value.trim();
        status.style.display = "block";
        if (!id) {
            status.textContent = "اكتب رقم الهوية أولًا.";
            return;
        }
        status.textContent =
            "تم استلام رقم الهوية. سيتم التحقق منه من قاعدة بيانات الموظفين.";
    }
    function goBack() {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
