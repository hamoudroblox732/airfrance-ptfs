<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS — Employee Login</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at 15% 0%,#183650,transparent 32%),
radial-gradient(circle at 100% 100%,#101e30,transparent 35%),
#05080d;
color:#fff
}

.box{
width:100%;
max-width:440px;
background:#0b1219;
border:1px solid #243446;
border-radius:22px;
padding:30px;
box-shadow:0 20px 60px #0008
}

.logo{
font-size:23px;
font-weight:900;
margin-bottom:7px
}

.subtitle{
color:#718092;
font-size:12px;
line-height:1.8;
margin-bottom:25px
}

label{
display:block;
font-size:11px;
font-weight:bold;
margin-bottom:8px
}

input{
width:100%;
padding:13px;
margin-bottom:14px;
background:#070b10;
border:1px solid #2a3b4d;
border-radius:10px;
color:#fff;
outline:none;
direction:ltr;
text-align:left
}

input:focus{
border-color:#2563eb
}

button{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:bold;
cursor:pointer
}

button:hover{
background:#3474f0
}

.error{
display:none;
margin-top:13px;
padding:12px;
border-radius:9px;
background:#32171b;
border:1px solid #57252d;
color:#e3a4aa;
font-size:11px;
line-height:1.7
}

.success{
display:none;
margin-top:13px;
padding:12px;
border-radius:9px;
background:#10281d;
border:1px solid #245238;
color:#9bd4ae;
font-size:11px
}

footer{
text-align:center;
margin-top:25px;
color:#40505f;
font-size:10px
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
AirFrance PTFS
</div>

<div class="subtitle">
Employee Portal<br>
سجّل الدخول باستخدام Roblox Username و Employee ID.
</div>

<label>
Roblox Username
</label>

<input
id="username"
type="text"
placeholder="Roblox Username"
autocomplete="off"
spellcheck="false">

<label>
Employee ID
</label>

<input
id="employeeId"
type="text"
placeholder="Employee ID"
autocomplete="off"
spellcheck="false">

<button onclick="login()">
Login
</button>

<div
class="error"
id="error">
</div>

<div
class="success"
id="success">
تم تسجيل الدخول.
</div>

<footer>
HAMOUD • AirFrance PTFS
</footer>

</div>

<script>

const OWNER_USERNAME = "Ahmad_roblox2222";
const OWNER_ID = "AF-OWNER-4827";

function normalizeUsername(value){

return String(value || "")
.trim()
.toLowerCase();

}

function normalizeId(value){

return String(value || "")
.trim()
.toUpperCase();

}

function getEmployees(){

const raw =
localStorage.getItem("af_employees");

if(!raw){
return [];
}

try{

const data =
JSON.parse(raw);

if(!Array.isArray(data)){
return [];
}

return data;

}catch(error){

return [];

}

}

function showError(message){

const error =
document.getElementById("error");

const success =
document.getElementById("success");

success.style.display = "none";

error.textContent = message;

error.style.display = "block";

}

function showSuccess(message){

const error =
document.getElementById("error");

const success =
document.getElementById("success");

error.style.display = "none";

success.textContent = message;

success.style.display = "block";

}

function login(){

const username =
document
.getElementById("username")
.value;

const employeeId =
document
.getElementById("employeeId")
.value;

const usernameNormalized =
normalizeUsername(username);

const idNormalized =
normalizeId(employeeId);

if(!usernameNormalized || !idNormalized){

showError(
"أدخل Roblox Username و Employee ID."
);

return;

}

const ownerUsername =
normalizeUsername(OWNER_USERNAME);

const ownerId =
normalizeId(OWNER_ID);

if(
usernameNormalized === ownerUsername &&
idNormalized === ownerId
){

sessionStorage.setItem(
"af_user",
OWNER_USERNAME
);

sessionStorage.setItem(
"af_id",
OWNER_ID
);

sessionStorage.setItem(
"af_role",
"Owner"
);

showSuccess(
"تم التحقق من هوية المالك."
);

setTimeout(function(){

location.href = "owner.html";

},500);

return;

}

const employees =
getEmployees();

const employee =
employees.find(function(item){

if(!item){
return false;
}

const savedUsername =
normalizeUsername(item.username);

const savedId =
normalizeId(item.employeeId);

return(
savedUsername === usernameNormalized &&
savedId === idNormalized
);

});

if(!employee){

showError(
"لم يتم العثور على هوية مطابقة. تأكد من اليوزر والـEmployee ID."
);

return;

}

sessionStorage.setItem(
"af_user",
employee.username
);

sessionStorage.setItem(
"af_id",
employee.employeeId
);

sessionStorage.setItem(
"af_role",
employee.role
);

showSuccess(
"تم تسجيل الدخول كـ " + employee.role
);

setTimeout(function(){

location.href = "staff.html";

},500);

}

document
.getElementById("username")
.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

login();

}

});

document
.getElementById("employeeId")
.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

login();

}

});

</script>

</body>
</html>
