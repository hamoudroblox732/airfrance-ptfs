<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
min-height:100vh;
background:
radial-gradient(circle at 15% 0%,#183650,transparent 32%),
radial-gradient(circle at 100% 100%,#101e30,transparent 35%),
#05080d;
color:#fff
}

header{
height:74px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
border-bottom:1px solid #202e3d;
background:#080d14ee
}

.logo{
font-size:22px;
font-weight:900
}

.badge{
font-size:10px;
color:#8ca7c3;
border:1px solid #293c50;
border-radius:20px;
padding:8px 12px
}

main{
min-height:calc(100vh - 74px);
display:flex;
align-items:center;
justify-content:center;
padding:25px
}

.container{
width:100%;
max-width:950px
}

.hero{
text-align:center;
margin-bottom:25px
}

.hero small{
font-size:10px;
letter-spacing:3px;
color:#6885a5
}

.hero h1{
font-size:42px;
margin:12px 0
}

.hero p{
font-size:13px;
line-height:1.8;
color:#788697;
max-width:600px;
margin:auto
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px
}

.card{
background:#0b1219;
border:1px solid #202e3d;
border-radius:20px;
padding:28px;
transition:.2s
}

.card:hover{
transform:translateY(-5px);
border-color:#315b89
}

.card h2{
font-size:18px;
margin-bottom:9px
}

.card p{
font-size:11px;
line-height:1.8;
color:#788697
}

button{
width:100%;
margin-top:20px;
padding:13px;
border:0;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:bold;
cursor:pointer
}

.employee{
background:#101820
}

footer{
text-align:center;
color:#40505f;
font-size:10px;
padding:25px
}

@media(max-width:650px){

.hero h1{
font-size:31px
}

.cards{
grid-template-columns:1fr
}

main{
padding:15px
}

}
</style>
</head>

<body>

<header>

<div class="logo">
AirFrance PTFS
</div>

<div class="badge">
PTFS AIRLINE SYSTEM
</div>

</header>

<main>

<div class="container">

<section class="hero">

<small>
AIRFRANCE PTFS
</small>

<h1>
Welcome
</h1>

<p>
مرحبًا بك في نظام AirFrance PTFS.
اختر البوابة التي تريد الدخول إليها.
</p>

</section>

<section class="cards">

<div class="card">

<h2>
Passenger
</h2>

<p>
بوابة المسافر لمتابعة الرحلات والخدمات والحجوزات.
</p>

<button onclick="location.href='verify.html'">
Passenger Portal
</button>

</div>

<div class="card employee">

<h2>
Employee
</h2>

<p>
بوابة الموظفين لتسجيل الدخول حسب الهوية والرتبة.
</p>

<button onclick="location.href='employee.html'">
Employee Portal
</button>

</div>

</section>

<footer>
HAMOUD • AirFrance PTFS
</footer>

</div>

</main>

</body>
</html>
