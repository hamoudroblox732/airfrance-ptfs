<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS — Flight Details</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#182334;
min-height:100vh
}

.page{
max-width:1100px;
margin:auto;
padding:25px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px
}

.back{
border:1px solid #dfe4eb;
background:#fff;
color:#123b73;
padding:10px 15px;
border-radius:9px;
font-weight:800;
cursor:pointer
}

.brand{
font-size:18px;
font-weight:900;
color:#123b73
}

.hero{
background:linear-gradient(135deg,#123b73,#1d579f);
color:#fff;
border-radius:18px;
padding:28px;
margin-bottom:18px
}

.flight-number{
font-size:28px;
font-weight:900
}

.route{
display:flex;
align-items:center;
gap:18px;
margin-top:20px
}

.airport{
font-size:30px;
font-weight:900
}

.arrow{
font-size:22px;
opacity:.7
}

.route-label{
font-size:11px;
opacity:.7;
margin-top:4px
}

.status{
display:inline-block;
margin-top:20px;
background:rgba(255,255,255,.15);
padding:8px 12px;
border-radius:8px;
font-size:11px;
font-weight:900
}

.grid{
display:grid;
grid-template-columns:1.4fr 1fr;
gap:18px
}

.card{
background:#fff;
border:1px solid #e3e8ef;
border-radius:15px;
padding:20px
}

.card-title{
font-size:17px;
font-weight:900;
margin-bottom:17px
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.info{
background:#f7f9fc;
border-radius:10px;
padding:13px
}

.label{
font-size:9px;
font-weight:800;
color:#98a1b1;
text-transform:uppercase
}

.value{
font-size:13px;
font-weight:800;
margin-top:5px
}

.crew{
display:grid;
gap:9px
}

.crew-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#f7f9fc;
padding:13px;
border-radius:10px
}

.crew-role{
font-size:10px;
color:#8c96a5;
font-weight:700
}

.crew-name{
font-size:13px;
font-weight:800;
margin-top:3px
}

.actions{
display:grid;
gap:10px;
margin-top:18px
}

.action{
width:100%;
border:0;
background:#123b73;
color:#fff;
padding:12px;
border-radius:9px;
font-weight:800;
cursor:pointer
}

.action.secondary{
background:#eef3f9;
color:#123b73
}

.action.danger{
background:#fff0f0;
color:#b42318
}

.notice{
background:#f7f9fc;
border-radius:10px;
padding:14px;
font-size:12px;
color:#687386;
line-height:1.5
}

.server-input{
width:100%;
border:1px solid #dfe4eb;
border-radius:9px;
padding:12px;
margin-top:12px;
outline:none
}

.loading{
background:#fff;
border:1px solid #e3e8ef;
border-radius:15px;
padding:45px;
text-align:center;
color:#8c96a5
}

.modal-bg{
position:fixed;
inset:0;
background:rgba(10,20,35,.45);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:50
}

.modal{
background:#fff;
width:min(430px,100%);
border-radius:15px;
padding:22px
}

.modal h2{
font-size:19px;
margin-bottom:8px
}

.modal p{
font-size:12px;
color:#7b8595;
margin-bottom:15px
}

.reason{
width:100%;
min-height:120px;
resize:none;
border:1px solid #dfe4eb;
border-radius:9px;
padding:12px;
outline:none
}

.modal-actions{
display:flex;
gap:9px;
margin-top:12px
}

.modal-actions button{
flex:1;
padding:11px;
border:0;
border-radius:9px;
font-weight:800;
cursor:pointer
}

.cancel{
background:#eef2f6
}

.confirm{
background:#123b73;
color:#fff
}

@media(max-width:750px){
.page{padding:16px}

.grid{
grid-template-columns:1fr
}

.route{
gap:12px
}

.airport{
font-size:24px
}

.info-grid{
grid-template-columns:1fr 1fr
}
}
</style>
</head>

<body>

<div class="page">

<div class="top">

<button class="back" onclick="history.back()">
← Back
</button>

<div class="brand">
AirFrance PTFS
</div>

</div>

<div id="content">

<div class="loading">
Loading flight...
</div>

</div>

</div>

<div class="modal-bg" id="leaveModal">

<div class="modal">

<h2>Leave Flight</h2>

<p>
Enter a reason before sending your leave request to the Owner.
</p>

<textarea
class="reason"
id="leaveReason"
placeholder="Reason for leaving..."
></textarea>

<div class="modal-actions">

<button
class="cancel"
onclick="closeLeaveModal()"
>
Cancel
</button>

<button
class="confirm"
onclick="submitLeaveRequest()"
>
Send Request
</button>

</div>

</div>

</div>

<script>

const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";
const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const username=sessionStorage.getItem("af_user");
const employeeId=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

const flightId=sessionStorage.getItem("af_selected_flight");

let flight=null;
let crew=[];

async function request(url,options={}){

const response=await fetch(
SUPABASE_URL+url,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
...(options.headers||{})
}
}
);

if(!response.ok){

let message="Request failed";

try{
const data=await response.json();
message=data.message||data.hint||message;
}catch(e){}

throw new Error(message);

}

if(response.status===204){
return null;
}

return response.json();

}

async function loadFlight(){

if(!flightId){

showError("No flight selected.");

return;
}

try{

const data=await request(
"/rest/v1/flights?id=eq."+
encodeURIComponent(flightId)+
"&select=*"
);

if(!data.length){

showError("Flight not found.");

return;
}

flight=data[0];

await loadCrew();

render();

}catch(error){

showError(error.message||"Unable to load flight.");

}

}

async function loadCrew(){

crew=await request(
"/rest/v1/flight_crew?flight_id=eq."+
encodeURIComponent(flightId)+
"&active=eq.true&select=*&order=joined_at.asc"
);

}

function render(){

const isEmployee=!!username&&!!employeeId;
const canJoin=
isEmployee &&
[
"Pilot",
"Co-Pilot",
"Cabin Crew",
"Ground Crew"
].includes(role);

const existing=crew.find(
member=>member.employee_id===employeeId
);

const pilot=crew.find(
member=>member.role==="Pilot"
);

const copilot=crew.find(
member=>member.role==="Co-Pilot"
);

const cabin=crew.filter(
member=>member.role==="Cabin Crew"
);

const ground=crew.filter(
member=>member.role==="Ground Crew"
);

let joinButton="";

if(canJoin&&!existing){

joinButton=`
<button
class="action"
onclick="joinFlight()"
>
Join Flight
</button>
`;

}

let leaveButton="";

if(existing){

leaveButton=`
<button
class="action danger"
onclick="openLeaveModal()"
>
Leave Flight
</button>
`;

}

let serverSection="";

if(role==="Pilot"&&existing){

serverSection=`
<div class="card" style="margin-top:18px">

<div class="card-title">
Roblox Server
</div>

<div class="notice">
Add the Roblox private server link for this flight.
</div>

<input
class="server-input"
id="serverLink"
placeholder="https://www.roblox.com/share..."
value="${safe(flight.server_link||"")}"
>

<button
class="action"
style="margin-top:10px"
onclick="saveServerLink()"
>
Save Server Link
</button>

</div>
`;

}else{

serverSection=`
<div class="card" style="margin-top:18px">

<div class="card-title">
Roblox Server
</div>

<div class="notice">
The server link will appear here for passengers with a valid booking once the pilot adds it.
</div>

</div>
`;

}

document.getElementById("content").innerHTML=`

<section class="hero">

<div class="flight-number">
${safe(flight.flight_number||"Unknown Flight")}
</div>

<div class="route">

<div>
<div class="airport">
${safe(flight.departure||"—")}
</div>
<div class="route-label">
DEPARTURE
</div>
</div>

<div class="arrow">→</div>

<div>
<div class="airport">
${safe(flight.destination||"—")}
</div>
<div class="route-label">
DESTINATION
</div>
</div>

</div>

<div class="status">
${safe(flight.status||"Scheduled")}
</div>

</section>

<div class="grid">

<div>

<div class="card">

<div class="card-title">
Flight Information
</div>

<div class="info-grid">

<div class="info">
<div class="label">Aircraft</div>
<div class="value">
${safe(flight.aircraft||"—")}
</div>
</div>

<div class="info">
<div class="label">Pilot</div>
<div class="value">
${safe(pilot?.username||flight.pilot||"Not assigned")}
</div>
</div>

<div class="info">
<div class="label">Final Boarding</div>
<div class="value">
${formatDate(flight.boarding_time)}
</div>
</div>

<div class="info">
<div class="label">Departure</div>
<div class="value">
${formatDate(flight.departure_time)}
</div>
</div>

<div class="info">
<div class="label">Economy Seats</div>
<div class="value">
${number(flight.economy_seats)}
</div>
</div>

<div class="info">
<div class="label">Business Seats</div>
<div class="value">
${number(flight.business_seats)}
</div>
</div>

<div class="info">
<div class="label">First Seats</div>
<div class="value">
${number(flight.first_seats)}
</div>
</div>

<div class="info">
<div class="label">Boarding Closed</div>
<div class="value">
${flight.closed?"Yes":"No"}
</div>
</div>

</div>

</div>

<div class="card" style="margin-top:18px">

<div class="card-title">
Boarding Times
</div>

<div class="info-grid">

<div class="info">
<div class="label">Economy</div>
<div class="value">
${formatDate(flight.economy_boarding_time)}
</div>
</div>

<div class="info">
<div class="label">Business</div>
<div class="value">
${formatDate(flight.business_boarding_time)}
</div>
</div>

<div class="info">
<div class="label">First Class</div>
<div class="value">
${formatDate(flight.first_boarding_time)}
</div>
</div>

</div>

</div>

</div>

<div>

<div class="card">

<div class="card-title">
Flight Crew
</div>

<div class="crew">

${crewMember("Pilot",pilot)}

${crewMember("Co-Pilot",copilot)}

${crewList("Cabin Crew",cabin)}

${crewList("Ground Crew",ground)}

</div>

<div class="actions">

${joinButton}

${leaveButton}

</div>

</div>

${serverSection}

</div>

</div>
`;

}

function crewMember(label,member){

return`
<div class="crew-item">

<div>

<div class="crew-role">
${safe(label)}
</div>

<div class="crew-name">
${safe(member?.username||"Not assigned")}
</div>

</div>

</div>
`;

}

function crewList(label,members){

return`
<div class="crew-item">

<div>

<div class="crew-role">
${safe(label)}
</div>

<div class="crew-name">
${
members.length
?
members.map(x=>safe(x.username)).join(", ")
:
"Not assigned"
}
</div>

</div>

</div>
`;

}

async function joinFlight(){

if(!username||!employeeId||!role){

alert("You need an employee account to join a flight.");

return;
}

if(
!["Pilot","Co-Pilot","Cabin Crew","Ground Crew"].includes(role)
){

alert("Your role cannot join flights.");

return;
}

try{

const existing=crew.find(
member=>member.employee_id===employeeId
);

if(existing){

alert("You are already on this flight.");

return;
}

if(role==="Pilot"){

const anotherPilot=crew.find(
member=>member.role==="Pilot"
);

if(anotherPilot){

alert("This flight already has a Pilot.");

return;
}

}

if(role==="Co-Pilot"){

const pilotExists=crew.some(
member=>member.role==="Pilot"
);

if(!pilotExists){

alert("A Pilot must join the flight first.");

return;
}

const anotherCopilot=crew.find(
member=>member.role==="Co-Pilot"
);

if(anotherCopilot){

alert("This flight already has a Co-Pilot.");

return;
}

}

await request(
"/rest/v1/flight_crew",
{
method:"POST",
body:JSON.stringify({
flight_id:Number(flightId),
username:username,
employee_id:employeeId,
role:role,
active:true
})
);

if(role==="Pilot"){

await request(
"/rest/v1/flights?id=eq."+
encodeURIComponent(flightId),
{
method:"PATCH",
body:JSON.stringify({
pilot:username
})
}
);

}

alert("You joined the flight.");

await loadFlight();

}catch(error){

alert(error.message||"Unable to join flight.");

}

}

function openLeaveModal(){

document.getElementById("leaveReason").value="";
document.getElementById("leaveModal").style.display="flex";

}

function closeLeaveModal(){

document.getElementById("leaveModal").style.display="none";

}

async function submitLeaveRequest(){

const reason=document
.getElementById("leaveReason")
.value
.trim();

if(!reason){

alert("Please enter a reason.");

return;
}

try{

await request(
"/rest/v1/leave_requests",
{
method:"POST",
body:JSON.stringify({
flight_id:Number(flightId),
username:username,
employee_id:employeeId,
role:role,
reason:reason
})
);

await request(
"/rest/v1/flight_crew?id=eq."+
encodeURIComponent(
crew.find(x=>x.employee_id===employeeId)?.id
),
{
method:"PATCH",
body:JSON.stringify({
active:false
})
}
);

if(role==="Pilot"){

await request(
"/rest/v1/flights?id=eq."+
encodeURIComponent(flightId),
{
method:"PATCH",
body:JSON.stringify({
pilot:null
})
}
);

}

closeLeaveModal();

alert("Your leave request was sent to the Owner.");

await loadFlight();

}catch(error){

alert(error.message||"Unable to send request.");

}

}

async function saveServerLink(){

if(role!=="Pilot"){

return;
}

const input=document.getElementById("serverLink");

const link=input.value.trim();

if(
link &&
!(
link.startsWith("https://www.roblox.com/")||
link.startsWith("https://roblox.com/")
)
){

alert("Enter a valid Roblox link.");

return;
}

try{

await request(
"/rest/v1/flights?id=eq."+
encodeURIComponent(flightId),
{
method:"PATCH",
body:JSON.stringify({
server_link:link||null
})
}
);

alert("Server link saved.");

await loadFlight();

}catch(error){

alert(error.message||"Unable to save server link.");

}

}

function showError(message){

document.getElementById("content").innerHTML=`
<div class="loading">
${safe(message)}
</div>
`;

}

function formatDate(value){

if(!value)return"—";

const date=new Date(value);

if(Number.isNaN(date.getTime()))return"—";

return date.toLocaleString(
"en-SA",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}

function number(value){

if(value===null||value===undefined){
return"0";
}

return String(value);

}

function safe(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

loadFlight();

</script>

</body>
</html>
