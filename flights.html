<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Flights — AirFrance PTFS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#0d121a;border-bottom:1px solid #222b36}
.container{max-width:950px;margin:auto;padding:22px}
.back{background:#202832;width:auto;padding:12px 20px}
.title{margin:25px 0 5px;font-size:30px}
.sub{color:#8793a3}
.card{margin-top:20px;background:#0e131b;border:1px solid #222d3a;border-radius:18px;padding:20px}
.flight{padding:20px 0;border-bottom:1px solid #202832}
.flight:last-child{border-bottom:0}
.route{font-size:22px;font-weight:800}
.meta{color:#9aa6b6;line-height:1.8;margin-top:8px}
.empty{text-align:center;color:#8995a5;padding:35px}
.delete{margin-top:12px;background:#a82d37}
</style>
</head>
<body>

<header>
<button class="back" onclick="location.href='staff.html'">Back to Dashboard</button>
</header>

<div class="container">
<h1 class="title">My Flights</h1>
<div class="sub" id="account"></div>

<div class="card" id="flights">
<div class="empty">Loading flights...</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";
const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const username=sessionStorage.getItem("af_user");
const employeeId=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(!username||!employeeId||!role){
location.replace("employee.html");
}else{
document.getElementById("account").textContent=username+" • "+employeeId;
}

async function loadFlights(){
const box=document.getElementById("flights");

let request=db
.from("flights")
.select("*")
.order("created_at",{ascending:false});

if(role==="Pilot"){
request=request.eq("pilot",username);
}

const {data,error}=await request;

if(error){
box.innerHTML='<div class="empty">Could not load flights.</div>';
return;
}

if(!data||data.length===0){
box.innerHTML='<div class="empty">No flights found for this account.</div>';
return;
}

box.innerHTML="";

data.forEach(f=>{
const item=document.createElement("div");
item.className="flight";

let html=
'<div class="route">'+escapeHtml(f.flight_number)+' — '+
escapeHtml(f.departure)+' → '+escapeHtml(f.destination)+'</div>'+
'<div class="meta">'+
'Aircraft: '+escapeHtml(f.aircraft)+'<br>'+
'Pilot: '+escapeHtml(f.pilot||"Not assigned")+'<br>'+
'Status: '+escapeHtml(f.status)+'</div>';

if(role==="Owner"){
html+='<button class="delete" onclick="deleteFlight('+f.id+')">Delete Flight</button>';
}

item.innerHTML=html;
box.appendChild(item);
});
}

async function deleteFlight(id){
if(!confirm("Delete this flight?"))return;

const {error}=await db
.from("flights")
.delete()
.eq("id",id);

if(error){
alert("Failed to delete flight.");
return;
}

loadFlights();
}

function escapeHtml(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

loadFlights();
</script>

</body>
</html>
