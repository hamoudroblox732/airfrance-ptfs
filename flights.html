<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flights — AirFrance PTFS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#07090d;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh
}

header{
padding:18px;
background:#0c1118;
border-bottom:1px solid #202a35
}

.back{
border:1px solid #2b3644;
background:#151c25;
color:#fff;
padding:12px 18px;
border-radius:12px;
font-weight:700;
cursor:pointer
}

.container{
max-width:1100px;
margin:auto;
padding:24px 18px 45px
}

.title{
font-size:32px;
margin:0
}

.sub{
color:#8491a1;
margin-top:7px;
font-size:14px
}

.card{
margin-top:20px;
background:#0e141c;
border:1px solid #222d3a;
border-radius:20px;
padding:20px
}

.flight{
padding:20px 0;
border-bottom:1px solid #202a35
}

.flight:last-child{
border-bottom:0
}

.top{
display:flex;
justify-content:space-between;
gap:15px
}

.route{
font-size:22px;
font-weight:800
}

.number{
color:#7d8998;
font-size:13px;
margin-top:6px
}

.status{
padding:8px 12px;
border-radius:9px;
background:#18202b;
font-size:12px;
font-weight:800;
height:max-content
}

.boarding{
background:#153a29;
color:#8fe0ad
}

.closed{
background:#332a17;
color:#e4c47d
}

.delayed{
background:#352916;
color:#e3bc70
}

.cancelled{
background:#3a181d;
color:#e09ca5
}

.departed,
.inflight,
.landed{
background:#182d45;
color:#9fc9f5
}

.meta{
margin-top:15px;
color:#9aa6b6;
line-height:1.9;
font-size:14px
}

.class-times{
margin-top:17px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.class-box{
background:#090d13;
border:1px solid #202a35;
border-radius:11px;
padding:12px
}

.class-name{
font-size:11px;
font-weight:800;
color:#fff;
margin-bottom:5px
}

.class-time{
font-size:11px;
color:#7f8d9d;
line-height:1.5
}

.actions{
display:flex;
flex-wrap:wrap;
gap:9px;
margin-top:17px
}

.action{
border:0;
padding:12px 15px;
border-radius:10px;
background:#1677ff;
color:#fff;
font-weight:800;
cursor:pointer
}

.action:hover{
background:#0d68e8
}

.dark{
background:#202a35
}

.dark:hover{
background:#2c3744
}

.warning{
background:#8a681f
}

.cancel{
background:#9f3039
}

.delete{
background:#70242c
}

.empty{
text-align:center;
color:#8995a5;
padding:35px
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
padding:18px;
z-index:20;
overflow:auto
}

.modal-box{
max-width:650px;
margin:5vh auto;
background:#0e141c;
border:1px solid #293442;
border-radius:20px;
padding:23px
}

.modal-box h2{
margin:0 0 7px
}

.modal-sub{
color:#8491a1;
font-size:13px;
margin-bottom:18px
}

.section{
margin-top:20px;
padding-top:18px;
border-top:1px solid #202a35
}

.section-title{
font-size:15px;
font-weight:800
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px
}

.box{
background:#090d13;
border:1px solid #202a35;
border-radius:11px;
padding:11px
}

.box-title{
font-size:11px;
font-weight:800;
margin-bottom:7px
}

label{
display:block;
margin:14px 0 7px;
font-size:12px;
font-weight:700;
color:#aeb8c5
}

select,
input{
width:100%;
height:49px;
background:#080c12;
border:1px solid #293442;
border-radius:10px;
color:#fff;
padding:0 12px;
font-size:14px;
outline:none
}

select:focus,
input:focus{
border-color:#1677ff
}

.modal-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px
}

.save{
background:#1677ff;
color:#fff;
padding:14px;
border-radius:11px;
font-weight:800
}

.close{
background:#202a35;
color:#fff;
padding:14px;
border-radius:11px;
font-weight:800
}

.message{
text-align:center;
color:#9aa6b6;
font-size:13px;
margin-top:13px;
min-height:18px
}

@media(max-width:700px){

.container{
padding:20px 14px
}

.top{
flex-direction:column
}

.route{
font-size:19px
}

.class-times{
grid-template-columns:1fr
}

.grid{
grid-template-columns:1fr
}

.modal-actions{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<button class="back" onclick="goBack()">
Back
</button>

</header>

<div class="container">

<h1 class="title">
Flights
</h1>

<div class="sub" id="account"></div>

<div class="card" id="flights">

<div class="empty">
Loading flights...
</div>

</div>

</div>

<div class="modal" id="manageModal">

<div class="modal-box">

<h2>
Manage Flight
</h2>

<div class="modal-sub" id="manageInfo"></div>

<label>
Flight Status
</label>

<select id="manageStatus">

<option value="Scheduled">
Scheduled
</option>

<option value="Boarding">
Boarding
</option>

<option value="Delayed">
Delayed
</option>

<option value="Closed">
Closed — Boarding Closed
</option>

<option value="Cancelled">
Cancelled
</option>

<option value="Departed">
Departed
</option>

<option value="In Flight">
In Flight
</option>

<option value="Landed">
Landed
</option>

</select>

<div class="section">

<div class="section-title">
Class Boarding Times
</div>

<div class="grid">

<div class="box">

<div class="box-title">
Economy
</div>

<input
id="manageEconomyBoarding"
type="datetime-local">

</div>

<div class="box">

<div class="box-title">
Business
</div>

<input
id="manageBusinessBoarding"
type="datetime-local">

</div>

<div class="box">

<div class="box-title">
First
</div>

<input
id="manageFirstBoarding"
type="datetime-local">

</div>

</div>

</div>

<div class="section">

<div class="section-title">
Flight Timing
</div>

<label>
Final Boarding Time
</label>

<input
id="manageBoarding"
type="datetime-local">

<label>
Departure Time
</label>

<input
id="manageDeparture"
type="datetime-local">

</div>

<div class="modal-actions">

<button
class="save"
onclick="saveFlight()">

Save Changes

</button>

<button
class="close"
onclick="closeModal()">

Close

</button>

</div>

<div
class="message"
id="manageMessage">
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL=
"https://pjsadqfyvibsjrccnaum.supabase.co";

const SUPABASE_KEY=
"sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const db=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const username=
sessionStorage.getItem("af_user");

const employeeId=
sessionStorage.getItem("af_id");

const role=
sessionStorage.getItem("af_role");

if(
!username||
!employeeId||
!role
){

location.replace(
"employee.html"
);

}else{

document
.getElementById("account")
.textContent=
username+
" • "+
employeeId+
" • "+
role;

}

let selectedFlight=null;

function goBack(){

if(role==="Owner"){

location.replace(
"owner.html"
);

}else{

location.replace(
"staff.html"
);

}

}

function formatDate(value){

if(!value){
return"Not set";
}

return new Date(value).toLocaleString([],{
year:"numeric",
month:"short",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
});

}

function toLocalInput(value){

if(!value){
return"";
}

const date=
new Date(value);

const offset=
date.getTimezoneOffset()*60000;

return new Date(
date.getTime()-offset
)
.toISOString()
.slice(0,16);

}

function getStatus(flight){

if(
flight.status==="Cancelled"
){

return"Cancelled";

}

if(
flight.status==="Delayed"
){

return"Delayed";

}

if(
flight.status==="Landed"
){

return"Landed";

}

if(
flight.status==="In Flight"
){

return"In Flight";

}

if(
flight.status==="Departed"
){

return"Departed";

}

if(flight.closed){

if(
flight.departure_time&&
new Date()>=
new Date(flight.departure_time)
){

return"Departed";

}

return"Closed";

}

if(
!flight.boarding_time||
!flight.departure_time
){

return flight.status||
"Scheduled";

}

const now=
new Date();

const boarding=
new Date(
flight.boarding_time
);

const departure=
new Date(
flight.departure_time
);

if(now<boarding){

return"Scheduled";

}

if(
now>=boarding&&
now<departure
){

return"Boarding";

}

if(now>=departure){

return"Departed";

}

return"Scheduled";

}

function statusClass(status){

if(
status==="Boarding"
){

return"status boarding";

}

if(
status==="Closed"
){

return"status closed";

}

if(
status==="Delayed"
){

return"status delayed";

}

if(
status==="Cancelled"
){

return"status cancelled";

}

if(
status==="Departed"
){

return"status departed";

}

if(
status==="In Flight"
){

return"status inflight";

}

if(
status==="Landed"
){

return"status landed";

}

return"status";

}

function classTime(
flight,
className
){

if(
className==="Economy"
){

return flight.economy_boarding_time;

}

if(
className==="Business"
){

return flight.business_boarding_time;

}

if(
className==="First"
){

return flight.first_boarding_time;

}

return null;

}

async function loadFlights(){

const box=
document.getElementById(
"flights"
);

let request=
db
.from("flights")
.select("*")
.order(
"departure_time",
{
ascending:true
}
);

if(role==="Pilot"){

request=
request.eq(
"pilot",
username
);

}

const {
data,
error
}=
await request;

if(error){

box.innerHTML=
'<div class="empty">Could not load flights.</div>';

return;

}

if(
!data||
data.length===0
){

box.innerHTML=
'<div class="empty">No flights found.</div>';

return;

}

box.innerHTML="";

data.forEach(
function(flight){

const status=
getStatus(flight);

const item=
document.createElement(
"div"
);

item.className="flight";

let html=

'<div class="top">'+

'<div>'+

'<div class="route">'+
escapeHtml(
flight.departure
)+
' → '+
escapeHtml(
flight.destination
)+
'</div>'+

'<div class="number">'+
escapeHtml(
flight.flight_number
)+
'</div>'+

'</div>'+

'<div class="'+
statusClass(status)+
'">'+
escapeHtml(status)+
'</div>'+

'</div>'+

'<div class="meta">'+

'Aircraft: '+
escapeHtml(
flight.aircraft
)+
'<br>'+

'Pilot: '+
escapeHtml(
flight.pilot||
"Not assigned"
)+
'<br>'+

'Final Boarding: '+
escapeHtml(
formatDate(
flight.boarding_time
)
)+
'<br>'+

'Departure: '+
escapeHtml(
formatDate(
flight.departure_time
)
)+

'</div>'+

'<div class="class-times">'+

'<div class="class-box">'+

'<div class="class-name">'+
'Economy Boarding'+
'</div>'+

'<div class="class-time">'+
escapeHtml(
formatDate(
classTime(
flight,
"Economy"
)
)
)+
'</div>'+

'</div>'+

'<div class="class-box">'+

'<div class="class-name">'+
'Business Boarding'+
'</div>'+

'<div class="class-time">'+
escapeHtml(
formatDate(
classTime(
flight,
"Business"
)
)
)+
'</div>'+

'</div>'+

'<div class="class-box">'+

'<div class="class-name">'+
'First Boarding'+
'</div>'+

'<div class="class-time">'+
escapeHtml(
formatDate(
classTime(
flight,
"First"
)
)
)+
'</div>'+

'</div>'+

'</div>';

html+=
'<div class="actions">';

if(
role==="Owner"||
role==="Pilot"
){

html+=

'<button class="action" '+
'onclick="quickStatus('+flight.id+',\'Boarding\')">'+
'Start Boarding'+
'</button>';

html+=

'<button class="action dark" '+
'onclick="quickStatus('+flight.id+',\'Closed\')">'+
'Close Boarding'+
'</button>';

html+=

'<button class="action warning" '+
'onclick="quickStatus('+flight.id+',\'Delayed\')">'+
'Delay'+
'</button>';

html+=

'<button class="action cancel" '+
'onclick="quickStatus('+flight.id+',\'Cancelled\')">'+
'Cancel'+
'</button>';

html+=

'<button class="action dark" '+
'onclick="quickStatus('+flight.id+',\'Departed\')">'+
'Departed'+
'</button>';

html+=

'<button class="action dark" '+
'onclick="quickStatus('+flight.id+',\'In Flight\')">'+
'In Flight'+
'</button>';

html+=

'<button class="action dark" '+
'onclick="quickStatus('+flight.id+',\'Landed\')">'+
'Landed'+
'</button>';

html+=

'<button class="action" '+
'onclick="openManage('+flight.id+')">'+
'Manage'+
'</button>';

}

if(role==="Owner"){

html+=

'<button class="action delete" '+
'onclick="deleteFlight('+flight.id+')">'+
'Delete'+
'</button>';

}

html+=
'</div>';

item.innerHTML=
html;

box.appendChild(item);

}
);

}

async function quickStatus(
id,
status
){

if(
role!=="Owner"&&
role!=="Pilot"
){

return;

}

const {
data,
error
}=
await db
.from("flights")
.select("*")
.eq("id",id)
.single();

if(
error||
!data
){

alert(
"Could not find the flight."
);

return;

}

if(status==="Cancelled"){

if(
!confirm(
"Cancel this flight?"
)
){

return;

}

}

if(status==="Closed"){

if(
data.status==="Cancelled"||
data.status==="Landed"
){

alert(
"This flight cannot be closed."
);

return;

}

}

const updateData={
status:status
};

if(
status==="Closed"
){

updateData.closed=true;

}

if(
status==="Boarding"||
status==="Delayed"||
status==="Cancelled"
){

updateData.closed=false;

}

if(
status==="Departed"||
status==="In Flight"||
status==="Landed"
){

updateData.closed=true;

}

const {
error:updateError
}=
await db
.from("flights")
.update(updateData)
.eq("id",id);

if(updateError){

alert(
"Could not update the flight."
);

return;

}

loadFlights();

}

async function openManage(id){

const {
data,
error
}=
await db
.from("flights")
.select("*")
.eq("id",id)
.single();

if(
error||
!data
){

alert(
"Could not open this flight."
);

return;

}

selectedFlight=data;

document
.getElementById(
"manageInfo"
)
.textContent=
data.flight_number+
" • "+
data.departure+
" → "+
data.destination;

document
.getElementById(
"manageStatus"
)
.value=
data.closed
&&
data.status!=="Departed"&&
data.status!=="In Flight"&&
data.status!=="Landed"
?"Closed"
:(data.status||"Scheduled");

document
.getElementById(
"manageEconomyBoarding"
)
.value=
toLocalInput(
data.economy_boarding_time
);

document
.getElementById(
"manageBusinessBoarding"
)
.value=
toLocalInput(
data.business_boarding_time
);

document
.getElementById(
"manageFirstBoarding"
)
.value=
toLocalInput(
data.first_boarding_time
);

document
.getElementById(
"manageBoarding"
)
.value=
toLocalInput(
data.boarding_time
);

document
.getElementById(
"manageDeparture"
)
.value=
toLocalInput(
data.departure_time
);

document
.getElementById(
"manageMessage"
)
.textContent="";

document
.getElementById(
"manageModal"
)
.style.display="block";

}

function closeModal(){

document
.getElementById(
"manageModal"
)
.style.display="none";

selectedFlight=null;

}

async function saveFlight(){

if(!selectedFlight){
return;
}

const message=
document.getElementById(
"manageMessage"
);

const status=
document
.getElementById(
"manageStatus"
)
.value;

const economy=
document
.getElementById(
"manageEconomyBoarding"
)
.value;

const business=
document
.getElementById(
"manageBusinessBoarding"
)
.value;

const first=
document
.getElementById(
"manageFirstBoarding"
)
.value;

const boarding=
document
.getElementById(
"manageBoarding"
)
.value;

const departure=
document
.getElementById(
"manageDeparture"
)
.value;

if(
!economy||
!business||
!first||
!boarding||
!departure
){

message.textContent=
"Please set all boarding and departure times.";

return;

}

const economyDate=
new Date(economy);

const businessDate=
new Date(business);

const firstDate=
new Date(first);

const boardingDate=
new Date(boarding);

const departureDate=
new Date(departure);

if(
economyDate>=boardingDate||
businessDate>=boardingDate||
firstDate>=boardingDate
){

message.textContent=
"Class boarding times must be before final boarding.";

return;

}

if(
departureDate<=boardingDate
){

message.textContent=
"Departure must be after final boarding.";

return;

}

message.textContent=
"Saving...";

const {
error
}=
await db
.from("flights")
.update({

status:status,

economy_boarding_time:
economyDate.toISOString(),

business_boarding_time:
businessDate.toISOString(),

first_boarding_time:
firstDate.toISOString(),

boarding_time:
boardingDate.toISOString(),

departure_time:
departureDate.toISOString(),

closed:
status==="Closed"||
status==="Departed"||
status==="In Flight"||
status==="Landed"

})
.eq(
"id",
selectedFlight.id
);

if(error){

message.textContent=
"Could not update the flight.";

return;

}

closeModal();

loadFlights();

}

async function deleteFlight(id){

if(role!=="Owner"){
return;
}

if(
!confirm(
"Delete this flight?"
)
){

return;

}

const {
error
}=
await db
.from("flights")
.delete()
.eq("id",id);

if(error){

alert(
"Failed to delete flight."
);

return;

}

loadFlights();

}

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

window.addEventListener(
"click",
function(event){

const modal=
document.getElementById(
"manageModal"
);

if(
event.target===modal
){

closeModal();

}

});

loadFlights();

setInterval(
loadFlights,
30000
);

</script>

</body>
</html>
