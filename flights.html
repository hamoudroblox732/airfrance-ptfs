<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AirFrance PTFS — Flights</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
min-height:100%;
font-family:Arial,sans-serif;
background:#070a0f;
color:#fff;
}

body{
overflow-x:hidden;
}

.app{
min-height:100vh;
background:
radial-gradient(circle at 75% 10%,rgba(23,105,255,.10),transparent 30%),
radial-gradient(circle at 20% 80%,rgba(23,105,255,.05),transparent 25%),
#070a0f;
}

.main{
min-height:100vh;
padding:25px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.title{
font-size:28px;
font-weight:bold;
}

.sub{
font-size:13px;
color:#778599;
margin-top:5px;
}

.online{
display:flex;
align-items:center;
gap:8px;
padding:9px 13px;
border:1px solid #203026;
background:#0c1712;
border-radius:10px;
font-size:12px;
color:#80d49a;
}

.dot{
width:7px;
height:7px;
border-radius:50%;
background:#4bd477;
box-shadow:0 0 10px #4bd477;
}

.back{
background:#111923;
color:#cbd5e3;
border:1px solid #293747;
padding:12px 16px;
border-radius:10px;
cursor:pointer;
margin-bottom:18px;
}

.card{
background:#0d131c;
border:1px solid #202c3d;
border-radius:20px;
padding:22px;
}

.card-title{
font-size:18px;
font-weight:bold;
}

.card-sub{
font-size:12px;
color:#69778a;
margin-top:5px;
margin-bottom:20px;
}

.flight{
padding:18px;
margin-top:12px;
background:#0a1018;
border:1px solid #202d3d;
border-radius:15px;
transition:.2s;
}

.flight:hover{
border-color:#315a96;
transform:translateY(-2px);
}

.flight-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
}

.flight-number{
font-size:17px;
font-weight:bold;
}

.route{
font-size:14px;
color:#76a8ff;
margin-top:8px;
}

.info{
font-size:12px;
color:#6d7b8e;
margin-top:7px;
}

.status{
display:inline-block;
font-size:10px;
padding:6px 9px;
border-radius:7px;
background:#13291c;
color:#79d99a;
margin-bottom:10px;
}

.delete{
background:#321820;
color:#ff8c9a;
border:1px solid #552733;
padding:9px 12px;
border-radius:9px;
cursor:pointer;
}

.empty{
color:#69778a;
font-size:12px;
padding:35px 0;
text-align:center;
}

.message{
position:fixed;
left:25px;
bottom:25px;
background:#111a27;
border:1px solid #2b3e57;
padding:13px 16px;
border-radius:11px;
display:none;
z-index:50;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

@media(max-width:600px){

.main{
padding:15px;
padding-top:20px;
}

.title{
font-size:23px;
}

.topbar{
align-items:flex-start;
}

.flight-top{
flex-direction:column;
}

}
</style>
</head>

<body>

<div class="app">

<main class="main">

<button class="back" onclick="location.href='owner.html'">
← Back to Owner Dashboard
</button>

<div class="topbar">

<div>

<div class="title">
Flight Operations
</div>

<div class="sub">
AirFrance PTFS flight management
</div>

</div>

<div class="online">

<div class="dot"></div>

Online

</div>

</div>

<div class="card">

<div class="card-title">
All Flights
</div>

<div class="card-sub">
Live flights stored in the AirFrance PTFS database
</div>

<div id="flights">

<div class="empty">
Loading flights...
</div>

</div>

</div>

</main>

</div>

<div id="message" class="message"></div>

<script>

const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";

const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const OWNER_USERNAME="Ahmad_roblox2222";
const OWNER_ID="AF-OWNER-4827";

function checkOwner(){

const username=sessionStorage.getItem("af_user");
const id=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(
username!==OWNER_USERNAME ||
id!==OWNER_ID ||
role!=="Owner"
){

location.href="employee.html";

return false;

}

return true;

}

function showMessage(text){

const message=document.getElementById("message");

message.textContent=text;
message.style.display="block";

setTimeout(function(){

message.style.display="none";

},3000);

}

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

async function loadFlights(){

const box=document.getElementById("flights");

const {data,error}=await db
.from("flights")
.select("*")
.order("created_at",{ascending:false});

if(error){

box.innerHTML=
'<div class="empty">Database error.</div>';

return;

}

if(!data || !data.length){

box.innerHTML=
'<div class="empty">No flights have been created yet.</div>';

return;

}

box.innerHTML="";

data.forEach(function(flight){

const div=document.createElement("div");

div.className="flight";

div.innerHTML=`

<div class="flight-top">

<div>

<div class="flight-number">
${escapeHtml(flight.flight_number)}
</div>

<div class="route">
${escapeHtml(flight.departure)}
&nbsp;→&nbsp;
${escapeHtml(flight.destination)}
</div>

<div class="info">
Aircraft: ${escapeHtml(flight.aircraft)}
</div>

<div class="info">
Pilot: ${escapeHtml(flight.pilot || "Not assigned")}
</div>

<div class="info">
Created: ${formatDate(flight.created_at)}
</div>

</div>

<div>

<div class="status">
${escapeHtml(flight.status)}
</div>

<br>

<button
class="delete"
onclick="deleteFlight(${flight.id})">

Delete

</button>

</div>

</div>

`;

box.appendChild(div);

});

}

function formatDate(date){

if(!date){

return "Unknown";

}

return new Date(date).toLocaleString();

}

async function deleteFlight(id){

if(!confirm("Delete this flight?")){

return;

}

const {error}=await db
.from("flights")
.delete()
.eq("id",id);

if(error){

showMessage("تعذر حذف الرحلة.");

return;

}

showMessage("تم حذف الرحلة.");

loadFlights();

}

if(checkOwner()){

loadFlights();

}

</script>

</body>
</html>
