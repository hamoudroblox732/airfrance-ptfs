<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Flight - AirFrance PTFS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #202631;background:#0c1017}
button{padding:12px 18px;border:0;border-radius:9px;background:#1677ff;color:#fff;font-weight:bold}
.container{max-width:700px;margin:auto;padding:22px}
.card{background:#10151d;border:1px solid #202936;border-radius:16px;padding:22px;margin-top:18px}
label{display:block;margin-top:16px;margin-bottom:7px;color:#aeb7c4}
input,select{width:100%;padding:14px;border-radius:9px;border:1px solid #2b3440;background:#080b10;color:#fff;font-size:15px}
.submit{width:100%;margin-top:22px}
#message{margin-top:15px;text-align:center}
</style>
</head>
<body>

<header>
<button onclick="goBack()">Back</button>
</header>

<div class="container">
<h1>Create Flight</h1>

<div class="card">

<label>Flight Number</label>
<input id="flightNumber" placeholder="AF101">

<label>Aircraft</label>
<input id="aircraft" placeholder="A350-900">

<label>Departure</label>
<input id="departure" placeholder="JED">

<label>Destination</label>
<input id="destination" placeholder="CDG">

<label>Pilot</label>
<input id="pilot">

<label>Status</label>
<select id="status">
<option>Scheduled</option>
<option>Boarding</option>
<option>Departed</option>
<option>In Flight</option>
<option>Landed</option>
</select>

<button class="submit" onclick="createFlight()">Create Flight</button>

<div id="message"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";
const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const username=sessionStorage.getItem("af_user");
const employeeId=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(!username||!employeeId||!role){
location.href="employee.html";
}

const pilotInput=document.getElementById("pilot");

if(role==="Pilot"){
pilotInput.value=username;
pilotInput.readOnly=true;
}

function goBack(){
if(role==="Owner"){
location.href="owner.html";
}else{
location.href="staff.html";
}
}

async function createFlight(){

const flightNumber=document.getElementById("flightNumber").value.trim();
const aircraft=document.getElementById("aircraft").value.trim();
const departure=document.getElementById("departure").value.trim();
const destination=document.getElementById("destination").value.trim();
const pilot=document.getElementById("pilot").value.trim();
const status=document.getElementById("status").value;
const message=document.getElementById("message");

if(!flightNumber||!aircraft||!departure||!destination){
message.textContent="Fill in all fields.";
return;
}

const {data:existing}=await db
.from("flights")
.select("id")
.eq("flight_number",flightNumber)
.maybeSingle();

if(existing){
message.textContent="Flight number already exists.";
return;
}

const {error}=await db
.from("flights")
.insert([{
flight_number:flightNumber,
aircraft:aircraft,
departure:departure,
destination:destination,
pilot:pilot||null,
status:status
}]);

if(error){
message.textContent="Failed to create flight.";
return;
}

location.href="flights.html";
}
</script>

</body>
</html>
