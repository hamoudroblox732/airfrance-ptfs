<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AirFrance PTFS - Owner Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b10;
color:#fff;
min-height:100vh;
}

.container{
max-width:950px;
margin:auto;
padding:20px 15px 40px;
}

.header{
background:#111720;
border:1px solid #263242;
border-radius:18px;
padding:22px;
margin-bottom:15px;
}

.header h1{
margin:0;
font-size:26px;
}

.header p{
margin:7px 0 0;
color:#8e9aaa;
font-size:14px;
}

.tabs{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:15px;
}

.tab{
white-space:nowrap;
background:#111720;
border:1px solid #263242;
color:#aeb9c8;
padding:12px 16px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.tab.active{
background:#1769ff;
color:#fff;
border-color:#1769ff;
}

.panel{
display:none;
background:#111720;
border:1px solid #263242;
border-radius:18px;
padding:20px;
margin-bottom:15px;
}

.panel.active{
display:block;
}

h2{
margin-top:0;
}

label{
display:block;
margin:14px 0 7px;
font-size:14px;
color:#aab5c4;
}

input,select{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #303d4d;
background:#0a0e14;
color:#fff;
font-size:15px;
outline:none;
}

button{
border:0;
border-radius:11px;
padding:12px 16px;
background:#1769ff;
color:#fff;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

button:hover{
opacity:.9;
}

.danger{
background:#b82b3b;
}

.employee,.flight{
background:#0c1118;
border:1px solid #293646;
border-radius:14px;
padding:15px;
margin-top:12px;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.small{
font-size:13px;
color:#8996a8;
margin-top:5px;
}

.blue{
color:#6ea2ff;
}

.status{
display:inline-block;
margin-top:8px;
padding:5px 9px;
border-radius:8px;
background:#182b20;
color:#78d69a;
font-size:12px;
}

#message{
display:none;
background:#172131;
border:1px solid #293b52;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

.empty{
text-align:center;
padding:20px;
color:#7f8b9c;
}

.footer{
text-align:center;
color:#667386;
font-size:12px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>AirFrance PTFS — Owner Panel</h1>
<p>Owner: Ahmad_roblox2222 • AF-OWNER-4827</p>
</div>

<div id="message"></div>

<div class="tabs">

<button class="tab active" onclick="openPanel('identities',this)">
Identities
</button>

<button class="tab" onclick="openPanel('flights',this)">
Flights
</button>

<button class="tab" onclick="openPanel('createFlight',this)">
Create Flight
</button>

</div>

<div id="identities" class="panel active">

<h2>Create Employee Identity</h2>

<label>Roblox Username</label>
<input id="username" placeholder="Roblox Username">

<label>Employee ID</label>
<input id="employeeId" placeholder="Employee ID">

<label>Role</label>
<select id="role">
<option value="Pilot">Pilot</option>
<option value="Co-Pilot">Co-Pilot</option>
<option value="Cabin Crew">Cabin Crew</option>
<option value="Ground Crew">Ground Crew</option>
<option value="Management">Management</option>
</select>

<button onclick="createEmployee()">
Create Identity
</button>

<hr style="border:0;border-top:1px solid #293646;margin:25px 0">

<div class="row">
<h2 style="margin:0">Employees</h2>
<strong id="employeeCount">0</strong>
</div>

<div id="employees"></div>

</div>

<div id="flights" class="panel">

<div class="row">
<h2>Flights</h2>
<strong id="flightCount">0</strong>
</div>

<div id="flightsList"></div>

</div>

<div id="createFlight" class="panel">

<h2>Create Flight</h2>

<label>Flight Number</label>
<input id="flightNumber" placeholder="Flight Number">

<label>Departure</label>
<input id="departure" placeholder="Departure">

<label>Destination</label>
<input id="destination" placeholder="Destination">

<label>Aircraft</label>
<input id="aircraft" placeholder="Aircraft">

<label>Pilot</label>
<input id="pilot" placeholder="Pilot">

<button onclick="createFlight()">
Create Flight
</button>

</div>

<div class="footer">
HAMOUD • AirFrance PTFS
</div>

</div>

<script>

const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";

const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const OWNER_USERNAME="Ahmad_roblox2222";
const OWNER_ID="AF-OWNER-4827";

function showMessage(text){

const box=document.getElementById("message");

box.textContent=text;
box.style.display="block";

}

function openPanel(id,button){

document
.querySelectorAll(".panel")
.forEach(panel=>panel.classList.remove("active"));

document
.querySelectorAll(".tab")
.forEach(tab=>tab.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

button.classList.add("active");

if(id==="flights"){
loadFlights();
}

}

async function checkOwner(){

const username=sessionStorage.getItem("af_user");
const id=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(
username!==OWNER_USERNAME ||
id!==OWNER_ID ||
role!=="Owner"
){

window.location.href="employee.html";

return false;

}

return true;

}

async function createEmployee(){

const username=document
.getElementById("username")
.value
.trim();

const employeeId=document
.getElementById("employeeId")
.value
.trim();

const role=document
.getElementById("role")
.value;

if(!username || !employeeId){

showMessage("اكتب Roblox Username و Employee ID.");

return;

}

const {error}=await db
.from("employees")
.insert({
username:username,
employee_id:employeeId,
role:role
});

if(error){

showMessage("خطأ: "+error.message);

return;

}

document.getElementById("username").value="";
document.getElementById("employeeId").value="";

showMessage("تم إنشاء الهوية وحفظها أونلاين.");

loadEmployees();

}

async function loadEmployees(){

const {data,error}=await db
.from("employees")
.select("*")
.order("created_at",{ascending:false});

if(error){

showMessage("خطأ في تحميل الموظفين.");

return;

}

document.getElementById("employeeCount").textContent=data.length;

const box=document.getElementById("employees");

if(!data.length){

box.innerHTML=
'<div class="empty">لا توجد هويات.</div>';

return;

}

box.innerHTML="";

data.forEach(employee=>{

const div=document.createElement("div");

div.className="employee";

div.innerHTML=`

<div class="row">

<div>

<strong>${escapeHtml(employee.username)}</strong>

<div class="blue">
${escapeHtml(employee.role)}
</div>

<div class="small">
Employee ID: ${escapeHtml(employee.employee_id)}
</div>

</div>

<button
class="danger"
onclick="deleteEmployee(${employee.id})">
Delete
</button>

</div>

`;

box.appendChild(div);

});

}

async function deleteEmployee(id){

if(!confirm("حذف هوية هذا الموظف؟")) return;

const {error}=await db
.from("employees")
.delete()
.eq("id",id);

if(error){

showMessage("تعذر حذف الهوية.");

return;

}

showMessage("تم حذف الهوية.");

loadEmployees();

}

async function createFlight(){

const flightNumber=document
.getElementById("flightNumber")
.value
.trim();

const departure=document
.getElementById("departure")
.value
.trim();

const destination=document
.getElementById("destination")
.value
.trim();

const aircraft=document
.getElementById("aircraft")
.value
.trim();

const pilot=document
.getElementById("pilot")
.value
.trim();

if(
!flightNumber ||
!departure ||
!destination ||
!aircraft
){

showMessage("أكمل بيانات الرحلة.");

return;

}

const {error}=await db
.from("flights")
.insert({
flight_number:flightNumber,
departure:departure,
destination:destination,
aircraft:aircraft,
pilot:pilot || null,
status:"Scheduled"
});

if(error){

showMessage("خطأ في إنشاء الرحلة: "+error.message);

return;

}

document.getElementById("flightNumber").value="";
document.getElementById("departure").value="";
document.getElementById("destination").value="";
document.getElementById("aircraft").value="";
document.getElementById("pilot").value="";

showMessage("تم إنشاء الرحلة وحفظها أونلاين.");

}

async function loadFlights(){

const {data,error}=await db
.from("flights")
.select("*")
.order("created_at",{ascending:false});

if(error){

showMessage("خطأ في تحميل الرحلات.");

return;

}

document.getElementById("flightCount").textContent=data.length;

const box=document.getElementById("flightsList");

if(!data.length){

box.innerHTML=
'<div class="empty">لا توجد رحلات.</div>';

return;

}

box.innerHTML="";

data.forEach(flight=>{

const div=document.createElement("div");

div.className="flight";

div.innerHTML=`

<div class="row">

<div>

<strong>${escapeHtml(flight.flight_number)}</strong>

<div class="blue">
${escapeHtml(flight.departure)}
 →
 ${escapeHtml(flight.destination)}
</div>

<div class="small">
Aircraft: ${escapeHtml(flight.aircraft)}
</div>

<div class="small">
Pilot: ${escapeHtml(flight.pilot || "Not assigned")}
</div>

<div class="status">
${escapeHtml(flight.status)}
</div>

</div>

<button
class="danger"
onclick="deleteFlight(${flight.id})">
Delete
</button>

</div>

`;

box.appendChild(div);

});

}

async function deleteFlight(id){

if(!confirm("حذف هذه الرحلة؟")) return;

const {error}=await db
.from("flights")
.delete()
.eq("id",id);

if(error){

showMessage("تعذر حذف الرحلة.");

return;

}

showMessage("تم حذف الرحلة.");

loadFlights();

}

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

(async()=>{

const ok=await checkOwner();

if(ok){

loadEmployees();

}

})();

</script>

</body>
</html>
