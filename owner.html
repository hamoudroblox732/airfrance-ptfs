<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS — Owner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
min-height:100vh;
background:
radial-gradient(circle at 10% 0%,#183650,transparent 30%),
#05080d;
color:#fff
}

header{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
background:#080d14;
border-bottom:1px solid #202e3d
}

.logo{font-size:21px;font-weight:900}

.badge{
font-size:10px;
color:#9bb9df;
border:1px solid #2b4057;
padding:8px 12px;
border-radius:20px
}

main{
max-width:1100px;
margin:auto;
padding:22px
}

.hero,.panel{
background:#0b1219;
border:1px solid #202e3d;
border-radius:18px;
padding:22px;
margin-bottom:15px
}

.hero h1{font-size:27px;margin:8px 0}

.hero p,.muted{
font-size:11px;
color:#788697;
line-height:1.8
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}

label{
display:block;
font-size:11px;
font-weight:bold;
margin-bottom:7px
}

input,select{
width:100%;
padding:12px;
margin-bottom:12px;
background:#070b10;
border:1px solid #2b3b4d;
border-radius:9px;
color:#fff;
outline:none
}

button{
border:0;
border-radius:9px;
padding:11px 15px;
background:#2563eb;
color:#fff;
font-weight:bold;
cursor:pointer
}

button:hover{background:#3474f0}

.employee{
background:#0e161f;
border:1px solid #26384b;
border-radius:13px;
padding:15px;
margin-top:10px
}

.employee h3{
font-size:14px;
margin-bottom:8px
}

.employee p{
font-size:11px;
color:#8b99a8;
line-height:1.8
}

.actions{
display:flex;
gap:8px;
margin-top:12px;
flex-wrap:wrap
}

.delete{
background:#3a181d;
color:#e2a5aa
}

.empty{
text-align:center;
padding:25px;
font-size:11px;
color:#657486
}

.success{
display:none;
margin-top:12px;
padding:10px;
border-radius:9px;
background:#10281d;
color:#9bd4ae;
font-size:11px
}

footer{
text-align:center;
padding:25px;
color:#40505f;
font-size:10px
}

@media(max-width:700px){
.grid{grid-template-columns:1fr}
main{padding:13px}
}
</style>
</head>

<body>

<header>

<div class="logo">
AirFrance PTFS
</div>

<div class="badge">
OWNER PANEL
</div>

</header>

<main>

<section class="hero">

<h1>
Owner Dashboard
</h1>

<p>
مرحبًا Ahmad_roblox2222 — من هنا يمكنك إنشاء وإدارة هويات الموظفين.
</p>

</section>

<div class="grid">

<section class="panel">

<h2 style="font-size:16px;margin-bottom:16px">
Create Employee
</h2>

<label>
Roblox Username
</label>

<input
id="username"
placeholder="Roblox Username"
autocomplete="off">

<label>
Employee ID
</label>

<input
id="employeeId"
placeholder="Employee ID"
autocomplete="off">

<label>
Role
</label>

<select id="role">

<option value="Pilot">Pilot</option>
<option value="Co-Pilot">Co-Pilot</option>
<option value="Cabin Crew">Cabin Crew</option>
<option value="Ground Crew">Ground Crew</option>
<option value="Management">Management</option>

</select>

<button onclick="createEmployee()">
Create Identity
</button>

<div
class="success"
id="success">
تم حفظ الهوية بنجاح.
</div>

</section>

<section class="panel">

<h2 style="font-size:16px;margin-bottom:8px">
System
</h2>

<p class="muted">
Employee identities saved:
</p>

<h1 id="count" style="font-size:30px;margin-top:5px">
0
</h1>

<p class="muted" style="margin-top:10px">
Owner Username: Ahmad_roblox2222
<br>
Owner ID: AF-OWNER-4827
</p>

</section>

</div>

<section class="panel">

<h2 style="font-size:16px;margin-bottom:15px">
Employee Identities
</h2>

<div id="employees"></div>

</section>

<section class="panel">

<button
class="delete"
onclick="logout()">
Logout
</button>

</section>

</main>

<footer>
HAMOUD • AirFrance PTFS
</footer>

<script>

const OWNER_USERNAME="Ahmad_roblox2222";
const OWNER_ID="AF-OWNER-4827";

const STORAGE_KEY="af_employees";

function getEmployees(){

try{

const raw=
localStorage.getItem(STORAGE_KEY);

if(!raw){
return [];
}

const data=
JSON.parse(raw);

return Array.isArray(data) ? data : [];

}catch(error){

return [];

}

}

function saveEmployees(data){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}

function normalizeUsername(value){

return String(value || "")
.trim()
.toLowerCase();

}

function normalizeId(value){

return String(value || "")
.trim()
.toUpperCase();

}

function createEmployee(){

const username=
document
.getElementById("username")
.value
.trim();

const employeeId=
document
.getElementById("employeeId")
.value
.trim();

const role=
document
.getElementById("role")
.value;

if(!username || !employeeId){

alert("اكتب Roblox Username و Employee ID.");

return;

}

if(
normalizeUsername(username)===
normalizeUsername(OWNER_USERNAME)
){

alert("هذا اسم المالك.");

return;

}

let employees=
getEmployees();

const duplicateUsername=
employees.some(function(employee){

return normalizeUsername(employee.username)===
normalizeUsername(username);

});

if(duplicateUsername){

alert("هذا Roblox Username موجود بالفعل.");

return;

}

const duplicateId=
employees.some(function(employee){

return normalizeId(employee.employeeId)===
normalizeId(employeeId);

});

if(duplicateId){

alert("هذا Employee ID موجود بالفعل.");

return;

}

employees.push({

username:username,

employeeId:employeeId,

role:role,

createdAt:new Date().toISOString()

});

saveEmployees(employees);

document.getElementById("username").value="";
document.getElementById("employeeId").value="";

document.getElementById("success")
.style.display="block";

setTimeout(function(){

document.getElementById("success")
.style.display="none";

},2500);

renderEmployees();

}

function deleteEmployee(index){

const employees=
getEmployees();

if(!employees[index]){
return;
}

if(!confirm(
"هل تريد حذف هذه الهوية؟"
)){

return;

}

employees.splice(index,1);

saveEmployees(employees);

renderEmployees();

}

async function copyId(id){

try{

await navigator.clipboard.writeText(id);

alert("تم نسخ Employee ID.");

}catch(error){

alert(
"انسخ الـID يدويًا:\n"+id
);

}

}

function renderEmployees(){

const box=
document.getElementById("employees");

const employees=
getEmployees();

document.getElementById("count")
.textContent=employees.length;

if(!employees.length){

box.innerHTML=`
<div class="empty">
لا توجد هويات موظفين حتى الآن.
</div>
`;

return;

}

box.innerHTML=
employees.map(function(employee,index){

return `
<div class="employee">

<h3>
${escapeHtml(employee.username)}
</h3>

<p>
Employee ID:
<strong>
${escapeHtml(employee.employeeId)}
</strong>

<br>

Role:
${escapeHtml(employee.role)}

</p>

<div class="actions">

<button
onclick="copyId('${escapeHtml(employee.employeeId)}')">
Copy ID
</button>

<button
class="delete"
onclick="deleteEmployee(${index})">
Delete
</button>

</div>

</div>
`;

}).join("");

}

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function logout(){

sessionStorage.clear();

location.href="index.html";

}

renderEmployees();

</script>

</body>
</html>
