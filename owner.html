<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS - Owner</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b10;
color:#fff;
min-height:100vh;
}

.container{
max-width:900px;
margin:auto;
padding:25px 16px;
}

.header{
background:#111720;
border:1px solid #263242;
border-radius:18px;
padding:22px;
margin-bottom:18px;
}

h1{
margin:0 0 7px;
font-size:27px;
}

.sub{
color:#8e9aaa;
font-size:14px;
}

.card{
background:#111720;
border:1px solid #263242;
border-radius:18px;
padding:20px;
margin-bottom:18px;
}

label{
display:block;
margin:12px 0 7px;
color:#aab5c4;
font-size:14px;
}

input,
select{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #303d4d;
background:#0a0e14;
color:#fff;
outline:none;
font-size:15px;
}

button{
border:0;
border-radius:11px;
padding:12px 16px;
background:#1769ff;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

button:hover{
opacity:.9;
}

.danger{
background:#b82b3b;
}

.employee{
border:1px solid #293646;
background:#0c1118;
border-radius:14px;
padding:15px;
margin-top:12px;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

.role{
color:#6ea2ff;
font-size:13px;
margin-top:5px;
}

.id{
color:#9da9b8;
font-size:13px;
margin-top:5px;
}

#message{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:15px;
background:#172131;
color:#cdd8e8;
}

.empty{
color:#8995a5;
text-align:center;
padding:20px;
}

.footer{
text-align:center;
color:#667386;
font-size:12px;
padding:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>AirFrance PTFS — Owner</h1>
<div class="sub">Employee Identity Management</div>
</div>

<div id="message"></div>

<div class="card">
<h2>Create Employee Identity</h2>

<label>Roblox Username</label>
<input id="username" placeholder="Roblox Username">

<label>Employee ID</label>
<input id="employeeId" placeholder="Employee ID">

<label>Role</label>
<select id="role">
<option value="Pilot">Pilot</option>
<option value="Co-Pilot">Co-Pilot</option>
<option value="Cabin Crew">Cabin Crew</option>
<option value="Ground Crew">Ground Crew</option>
<option value="Management">Management</option>
</select>

<button onclick="createEmployee()">Create Identity</button>
</div>

<div class="card">

<div class="row">
<h2 style="margin:0">Employees</h2>
<strong id="count">0</strong>
</div>

<div id="employees"></div>

</div>

<div class="footer">
HAMOUD • AirFrance PTFS
</div>

</div>

<script>

const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";

const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const OWNER_USERNAME="Ahmad_roblox2222";
const OWNER_ID="AF-OWNER-4827";

function showMessage(text){

const box=document.getElementById("message");

box.textContent=text;
box.style.display="block";

}

async function checkOwner(){

const username=sessionStorage.getItem("af_user");
const id=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(
username!==OWNER_USERNAME ||
id!==OWNER_ID ||
role!=="Owner"
){

window.location.href="employee.html";

return false;

}

return true;

}

async function createEmployee(){

const username=document
.getElementById("username")
.value
.trim();

const employeeId=document
.getElementById("employeeId")
.value
.trim();

const role=document
.getElementById("role")
.value;

if(!username || !employeeId){

showMessage("اكتب Roblox Username و Employee ID.");

return;

}

const {error}=await db
.from("employees")
.insert({
username:username,
employee_id:employeeId,
role:role
});

if(error){

showMessage("خطأ: "+error.message);

return;

}

document.getElementById("username").value="";
document.getElementById("employeeId").value="";

showMessage("تم إنشاء هوية الموظف وحفظها أونلاين.");

loadEmployees();

}

async function loadEmployees(){

const {data,error}=await db
.from("employees")
.select("*")
.order("created_at",{ascending:false});

if(error){

showMessage("خطأ في تحميل الموظفين: "+error.message);

return;

}

document.getElementById("count").textContent=data.length;

const box=document.getElementById("employees");

if(!data.length){

box.innerHTML=
'<div class="empty">لا توجد هويات موظفين.</div>';

return;

}

box.innerHTML="";

data.forEach(employee=>{

const div=document.createElement("div");

div.className="employee";

div.innerHTML=`

<div class="row">

<div>

<strong>${escapeHtml(employee.username)}</strong>

<div class="role">
${escapeHtml(employee.role)}
</div>

<div class="id">
Employee ID: ${escapeHtml(employee.employee_id)}
</div>

</div>

<button
class="danger"
onclick="deleteEmployee(${employee.id})">
Delete
</button>

</div>

`;

box.appendChild(div);

});

}

async function deleteEmployee(id){

if(!confirm("حذف هوية هذا الموظف؟")){

return;

}

const {error}=await db
.from("employees")
.delete()
.eq("id",id);

if(error){

showMessage("خطأ: "+error.message);

return;

}

showMessage("تم حذف الهوية.");

loadEmployees();

}

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

(async()=>{

const ok=await checkOwner();

if(ok){

loadEmployees();

}

})();

</script>

</body>
</html>
