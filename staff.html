<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS — Dashboard</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#07090d;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh
}
header{
padding:22px;
background:linear-gradient(135deg,#101722,#0b0f16);
border-bottom:1px solid #222b36;
position:sticky;
top:0;
z-index:5
}
.brand{
font-size:25px;
font-weight:800
}
.sub{
color:#8793a3;
margin-top:5px
}
.container{
max-width:1050px;
margin:auto;
padding:24px
}
.hero{
background:linear-gradient(145deg,#111a27,#0d121a);
border:1px solid #263343;
border-radius:22px;
padding:28px;
margin-bottom:20px;
box-shadow:0 18px 50px rgba(0,0,0,.25)
}
.hero h1{
margin:0 0 8px;
font-size:30px
}
.hero p{
margin:0;
color:#9aa6b6
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px
}
.card{
background:#0e131b;
border:1px solid #222d3a;
border-radius:18px;
padding:22px;
transition:.2s
}
.card:hover{
border-color:#1677ff;
transform:translateY(-2px)
}
.card h2{
margin:0 0 8px
}
.card p{
color:#8995a5;
line-height:1.5;
min-height:45px
}
button{
width:100%;
padding:16px;
border:0;
border-radius:11px;
background:#1677ff;
color:#fff;
font-size:16px;
font-weight:700;
cursor:pointer
}
button:hover{
background:#0d65df
}
.profile{
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}
.info{
background:#090d13;
border:1px solid #202a35;
border-radius:12px;
padding:15px
}
.label{
font-size:12px;
color:#738092;
margin-bottom:6px
}
.value{
font-weight:700;
word-break:break-word
}
.logout{
margin-top:20px;
background:#242b35
}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.profile{grid-template-columns:1fr}
.container{padding:16px}
.hero{padding:22px}
}
</style>
</head>
<body>

<header>
<div class="brand">AirFrance PTFS</div>
<div class="sub">Crew Dashboard</div>
</header>

<div class="container">

<section class="hero">
<h1 id="welcome">Welcome</h1>
<p>Manage your AirFrance PTFS operations from your dashboard.</p>

<div class="profile">
<div class="info">
<div class="label">USERNAME</div>
<div class="value" id="username"></div>
</div>

<div class="info">
<div class="label">EMPLOYEE ID</div>
<div class="value" id="employeeId"></div>
</div>

<div class="info">
<div class="label">ROLE</div>
<div class="value" id="role"></div>
</div>
</div>
</section>

<div class="grid">

<div class="card">
<h2>My Flights</h2>
<p>View the flights assigned to your pilot account.</p>
<button onclick="location.href='flights.html'">Open My Flights</button>
</div>

<div class="card">
<h2>Create Flight</h2>
<p>Create a new flight and assign yourself as the pilot.</p>
<button onclick="location.href='create-flight.html'">Create Flight</button>
</div>

</div>

<button class="logout" onclick="logout()">Logout</button>

</div>

<script>
const username=sessionStorage.getItem("af_user");
const employeeId=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(!username||!employeeId||!role){
location.replace("employee.html");
}else{
document.getElementById("welcome").textContent="Welcome, "+username;
document.getElementById("username").textContent=username;
document.getElementById("employeeId").textContent=employeeId;
document.getElementById("role").textContent=role;
}

function logout(){
sessionStorage.removeItem("af_user");
sessionStorage.removeItem("af_id");
sessionStorage.removeItem("af_role");
location.replace("employee.html");
}
</script>

</body>
</html>
