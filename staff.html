<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS Staff</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#05080d;color:#fff;min-height:100vh}
header{height:72px;background:#080d14;border-bottom:1px solid #202d3b;display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.logo{font-size:21px;font-weight:900}.role{color:#9bb9df;font-size:10px;border:1px solid #2b3d53;padding:8px 12px;border-radius:20px}
main{max-width:1200px;margin:auto;padding:30px 20px}
.hero{padding:35px;background:linear-gradient(135deg,#101a26,#080d13);border:1px solid #223143;border-radius:22px;margin-bottom:18px}
.hero small{color:#6480a0;letter-spacing:2px}.hero h1{font-size:32px;margin:10px 0}.hero p{color:#778595;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#0b1219;border:1px solid #202d3b;border-radius:17px;padding:20px}
.card h2{font-size:15px;margin-bottom:8px}.card p{font-size:11px;color:#778595;line-height:1.7}
input,select{width:100%;background:#070b10;color:#fff;border:1px solid #2a3949;border-radius:10px;padding:12px;margin:7px 0 12px}
button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}
.danger{background:#3a181d;color:#e1a0a8}
.panel{background:#0b1219;border:1px solid #202d3b;border-radius:17px;padding:20px;margin-top:18px}
footer{text-align:center;color:#40505f;padding:30px;font-size:10px}
@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<div class="logo">AirFrance PTFS</div>
<div class="role" id="role">STAFF</div>
</header>

<main>
<div class="hero">
<small id="roleLabel">STAFF PORTAL</small>
<h1 id="welcome">Employee Dashboard</h1>
<p id="description"></p>
</div>

<div class="grid" id="cards"></div>

<div class="panel" id="pilotPanel" style="display:none">
<h2>طلب رحلة جديدة</h2>
<input id="flightTitle" placeholder="اسم الرحلة">
<button onclick="createFlight()">إرسال طلب الرحلة</button>
</div>

<div class="panel">
<button class="danger" onclick="logout()">تسجيل الخروج</button>
</div>
</main>

<footer>HAMOUD • AirFrance PTFS</footer>

<script>
const user=sessionStorage.getItem("af_user");
const role=sessionStorage.getItem("af_role");

if(!user||!role||role==="Owner")location.href="employee.html";

document.getElementById("role").textContent=role;
document.getElementById("welcome").textContent="مرحبًا "+user;
document.getElementById("roleLabel").textContent=role.toUpperCase()+" PORTAL";

const descriptions={
Pilot:"إنشاء طلبات الرحلات ومتابعة الرحلات الخاصة بك.",
"Co-Pilot":"متابعة الرحلات التي يتم تعيينك عليها.",
"Cabin Crew":"متابعة الرحلات والانضمام إلى طاقم المقصورة.",
"Ground Crew":"متابعة العمليات الأرضية للرحلات.",
Management:"إدارة الطلبات والموظفين حسب صلاحيات الإدارة."
};

document.getElementById("description").textContent=descriptions[role]||"بوابة الموظف.";

const data={
Pilot:["إنشاء رحلة","طلبات الرحلات","رحلاتي"],
"Co-Pilot":["رحلاتي","الرحلات المسندة","المعلومات"],
"Cabin Crew":["الرحلات","طاقم المقصورة","الجدول"],
"Ground Crew":["الرحلات القادمة","العمليات الأرضية","الجدول"],
Management:["إدارة الرحلات","طلبات الموظفين","المتابعة"]
};

document.getElementById("cards").innerHTML=(data[role]||[]).map(x=>
`<div class="card"><h2>${x}</h2><p>الوصول إلى قسم ${x} داخل النظام.</p></div>`
).join("");

if(role==="Pilot")document.getElementById("pilotPanel").style.display="block";

function createFlight(){
    const title=document.getElementById("flightTitle").value.trim();
    if(!title)return alert("اكتب اسم الرحلة.");

    const a=JSON.parse(localStorage.getItem("af_flights")||"[]");

    a.push({
        title:title,
        pilot:user,
        status:"PENDING"
    });

    localStorage.setItem("af_flights",JSON.stringify(a));
    document.getElementById("flightTitle").value="";
    alert("تم إرسال طلب الرحلة إلى الإدارة.");
}

function logout(){
    sessionStorage.clear();
    location.href="index.html";
}
</script>
</body>
</html>
