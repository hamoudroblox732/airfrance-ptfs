<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS - Staff</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080b10;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:22px;
background:#0c1017;
border-bottom:1px solid #202631;
}

h1{
margin:0;
font-size:27px;
}

.sub{
margin-top:6px;
color:#8d98a8;
}

.container{
max-width:900px;
margin:auto;
padding:24px;
}

.card{
background:#10151d;
border:1px solid #202936;
border-radius:16px;
padding:22px;
margin-bottom:18px;
}

.info{
color:#aeb7c4;
line-height:1.8;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:0;
border-radius:10px;
background:#1677ff;
color:#fff;
font-size:16px;
font-weight:bold;
}

button:hover{
background:#0d65df;
}

.logout{
background:#252b34;
}

.logout:hover{
background:#303743;
}
</style>
</head>

<body>

<header>
<h1>AirFrance PTFS</h1>
<div class="sub">Staff Portal</div>
</header>

<div class="container">

<div class="card">
<h2 id="welcome">Welcome</h2>
<div class="info">
<div id="username"></div>
<div id="employeeId"></div>
<div id="role"></div>
</div>
</div>

<div class="card">
<h2>Operations</h2>

<button id="flightsButton" onclick="location.href='flights.html'">
My Flights
</button>

<button id="createFlightButton" onclick="location.href='create-flight.html'">
Create Flight
</button>

</div>

<div class="card">
<button class="logout" onclick="logout()">Logout</button>
</div>

</div>

<script>
const username=sessionStorage.getItem("af_user");
const employeeId=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(!username||!employeeId||!role){
location.href="employee.html";
}

document.getElementById("welcome").textContent="Welcome, "+username;
document.getElementById("username").textContent="Username: "+username;
document.getElementById("employeeId").textContent="Employee ID: "+employeeId;
document.getElementById("role").textContent="Role: "+role;

const flightsButton=document.getElementById("flightsButton");
const createFlightButton=document.getElementById("createFlightButton");

if(role==="Pilot"){
flightsButton.textContent="My Flights";
createFlightButton.textContent="Create Flight";
}else{
flightsButton.textContent="Flights";
createFlightButton.textContent="Create Flight";
}

function logout(){
sessionStorage.clear();
location.href="employee.html";
}
</script>

</body>
</html>
