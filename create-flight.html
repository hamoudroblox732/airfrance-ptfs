<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Flight — AirFrance PTFS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#0d121a;border-bottom:1px solid #222b36}
.container{max-width:760px;margin:auto;padding:22px}
.back{background:#202832;width:auto;padding:12px 20px}
.card{margin-top:20px;background:#0e131b;border:1px solid #222d3a;border-radius:18px;padding:24px}
h1{font-size:30px;margin-bottom:6px}
.sub{color:#8793a3}
label{display:block;margin-top:18px;margin-bottom:7px;color:#aeb7c4}
input,select{
width:100%;
padding:15px;
background:#080b10;
border:1px solid #293442;
border-radius:10px;
color:#fff;
font-size:16px;
outline:none
}
input:focus,select:focus{border-color:#1677ff}
.submit{
width:100%;
margin-top:24px;
background:#1677ff
}
.message{text-align:center;margin-top:15px;color:#9aa6b6}
</style>
</head>
<body>

<header>
<button class="back" onclick="location.href='staff.html'">Back to Dashboard</button>
</header>

<div class="container">

<h1>Create Flight</h1>
<div class="sub">Create a new AirFrance PTFS flight.</div>

<div class="card">

<label>Flight Number</label>
<input id="flightNumber" placeholder="AF101">

<label>Aircraft</label>
<input id="aircraft" placeholder="A350-900">

<label>Departure</label>
<input id="departure" placeholder="JED">

<label>Destination</label>
<input id="destination" placeholder="CDG">

<label>Pilot</label>
<input id="pilot">

<label>Status</label>
<select id="status">
<option value="Scheduled">Scheduled</option>
<option value="Boarding">Boarding</option>
<option value="Departed">Departed</option>
<option value="In Flight">In Flight</option>
<option value="Landed">Landed</option>
</select>

<button class="submit" onclick="createFlight()">Create Flight</button>

<div class="message" id="message"></div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";
const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const username=sessionStorage.getItem("af_user");
const employeeId=sessionStorage.getItem("af_id");
const role=sessionStorage.getItem("af_role");

if(!username||!employeeId||!role){
location.replace("employee.html");
}

const pilotInput=document.getElementById("pilot");

if(role==="Pilot"){
pilotInput.value=username;
pilotInput.readOnly=true;
}

async function createFlight(){

const message=document.getElementById("message");

const flightNumber=document.getElementById("flightNumber").value.trim();
const aircraft=document.getElementById("aircraft").value.trim();
const departure=document.getElementById("departure").value.trim();
const destination=document.getElementById("destination").value.trim();
const pilot=pilotInput.value.trim();
const status=document.getElementById("status").value;

if(!flightNumber||!aircraft||!departure||!destination){
message.textContent="Please fill in all required fields.";
return;
}

const {data:existing,error:checkError}=await db
.from("flights")
.select("id")
.eq("flight_number",flightNumber)
.maybeSingle();

if(checkError){
message.textContent="Could not check the flight number.";
return;
}

if(existing){
message.textContent="This flight number already exists.";
return;
}

const {error}=await db
.from("flights")
.insert([{
flight_number:flightNumber,
departure:departure,
destination:destination,
aircraft:aircraft,
pilot:pilot||null,
status:status
}]);

if(error){
message.textContent="Could not create the flight.";
return;
}

location.replace("flights.html");
}
</script>

</body>
</html>
