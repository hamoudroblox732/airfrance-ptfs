<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Flight — AirFrance PTFS</title>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#07090d;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh
}

header{
padding:18px;
background:#0c1118;
border-bottom:1px solid #202a35;
display:flex;
align-items:center
}

.back{
border:1px solid #2b3644;
background:#151c25;
color:#fff;
padding:12px 18px;
border-radius:12px;
font-weight:700;
font-size:14px;
cursor:pointer
}

.back:hover{
background:#1d2733
}

.container{
max-width:760px;
margin:auto;
padding:24px 18px 40px
}

.hero{
margin-bottom:20px
}

.hero h1{
margin:0;
font-size:32px
}

.hero p{
margin:8px 0 0;
color:#8491a1;
font-size:15px
}

.card{
background:linear-gradient(145deg,#10161f,#0b1017);
border:1px solid #222d3a;
border-radius:22px;
padding:24px;
box-shadow:0 18px 50px rgba(0,0,0,.25)
}

label{
display:block;
margin:17px 0 7px;
font-size:13px;
font-weight:700;
color:#aeb8c5
}

input,
select{
width:100%;
height:52px;
padding:0 15px;
background:#080c12;
border:1px solid #293442;
border-radius:12px;
color:#fff;
font-size:15px;
outline:none
}

input:focus,
select:focus{
border-color:#1677ff;
box-shadow:0 0 0 3px rgba(22,119,255,.12)
}

.seat-title{
margin-top:24px;
font-size:17px;
font-weight:800
}

.seat-sub{
margin-top:5px;
color:#758292;
font-size:12px
}

.seat-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:14px
}

.seat-box{
background:#090d13;
border:1px solid #202a35;
border-radius:13px;
padding:13px
}

.seat-box span{
display:block;
font-size:12px;
font-weight:800;
margin-bottom:8px
}

.seat-box input{
height:46px
}

.time-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px
}

.create{
width:100%;
height:54px;
margin-top:25px;
border:0;
border-radius:13px;
background:#1677ff;
color:#fff;
font-size:16px;
font-weight:800;
cursor:pointer;
box-shadow:0 8px 25px rgba(22,119,255,.22)
}

.create:hover{
background:#0d68e8
}

.message{
min-height:22px;
margin-top:14px;
text-align:center;
color:#9aa6b6;
font-size:14px
}

@media(max-width:600px){

.container{
padding:20px 14px 35px
}

.card{
padding:19px;
border-radius:18px
}

.hero h1{
font-size:28px
}

.time-grid{
grid-template-columns:1fr
}

.seat-grid{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<button class="back" onclick="goBack()">
Back
</button>

</header>

<div class="container">

<div class="hero">

<h1>
Create Flight
</h1>

<p>
Create and schedule a new AirFrance PTFS flight.
</p>

</div>

<div class="card">

<label>
Flight Number
</label>

<input
id="flightNumber"
placeholder="AF101">

<label>
Aircraft
</label>

<input
id="aircraft"
placeholder="A350-900">

<label>
Departure
</label>

<input
id="departure"
placeholder="JED">

<label>
Destination
</label>

<input
id="destination"
placeholder="CDG">

<label>
Pilot
</label>

<input
id="pilot"
placeholder="Pilot username">

<div class="seat-title">
Seat Capacity
</div>

<div class="seat-sub">
Set the available seats for each cabin class.
</div>

<div class="seat-grid">

<div class="seat-box">

<span>
Economy
</span>

<input
id="economySeats"
type="number"
min="0"
value="0"
placeholder="0">

</div>

<div class="seat-box">

<span>
Business
</span>

<input
id="businessSeats"
type="number"
min="0"
value="0"
placeholder="0">

</div>

<div class="seat-box">

<span>
First
</span>

<input
id="firstSeats"
type="number"
min="0"
value="0"
placeholder="0">

</div>

</div>

<label>
Boarding Time
</label>

<input
id="boardingTime"
type="datetime-local">

<label>
Departure Time
</label>

<input
id="departureTime"
type="datetime-local">

<label>
Initial Status
</label>

<select id="status">

<option value="Scheduled">
Scheduled
</option>

<option value="Boarding">
Boarding
</option>

<option value="Delayed">
Delayed
</option>

</select>

<button
class="create"
onclick="createFlight()">

Create Flight

</button>

<div
class="message"
id="message">
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL=
"https://pjsadqfyvibsjrccnaum.supabase.co";

const SUPABASE_KEY=
"sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const db=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const username=
sessionStorage.getItem("af_user");

const employeeId=
sessionStorage.getItem("af_id");

const role=
sessionStorage.getItem("af_role");

if(
!username||
!employeeId||
!role
){

location.replace(
"employee.html"
);

}

function goBack(){

if(role==="Owner"){

location.replace(
"owner.html"
);

}else{

location.replace(
"staff.html"
);

}

}

const pilotInput=
document.getElementById("pilot");

if(role==="Pilot"){

pilotInput.value=
username;

pilotInput.readOnly=true;

}

function getISO(id){

const value=
document.getElementById(id).value;

if(!value){

return null;

}

return new Date(value).toISOString();

}

function getSeats(id){

const value=
Number(
document.getElementById(id).value
);

if(
!Number.isFinite(value)||
value<0
){

return 0;

}

return Math.floor(value);

}

async function createFlight(){

const message=
document.getElementById("message");

const flightNumber=
document
.getElementById("flightNumber")
.value
.trim();

const aircraft=
document
.getElementById("aircraft")
.value
.trim();

const departure=
document
.getElementById("departure")
.value
.trim();

const destination=
document
.getElementById("destination")
.value
.trim();

const pilot=
pilotInput.value.trim();

const boardingTime=
getISO("boardingTime");

const departureTime=
getISO("departureTime");

const status=
document
.getElementById("status")
.value;

const economySeats=
getSeats("economySeats");

const businessSeats=
getSeats("businessSeats");

const firstSeats=
getSeats("firstSeats");

if(
!flightNumber||
!aircraft||
!departure||
!destination||
!boardingTime||
!departureTime
){

message.textContent=
"Please fill in all required fields.";

return;

}

if(
economySeats+
businessSeats+
firstSeats<=0
){

message.textContent=
"Add at least one available seat.";

return;

}

if(
new Date(departureTime)<=
new Date(boardingTime)
){

message.textContent=
"Departure time must be after boarding time.";

return;

}

message.textContent=
"Creating flight...";

const {
data:existing,
error:checkError
}=
await db
.from("flights")
.select("id")
.eq(
"flight_number",
flightNumber
)
.maybeSingle();

if(checkError){

message.textContent=
"Could not check the flight number.";

return;

}

if(existing){

message.textContent=
"This flight number already exists.";

return;

}

const {
error
}=
await db
.from("flights")
.insert([{

flight_number:
flightNumber,

departure:
departure,

destination:
destination,

aircraft:
aircraft,

pilot:
pilot||null,

status:
status,

boarding_time:
boardingTime,

departure_time:
departureTime,

closed:
false,

economy_seats:
economySeats,

business_seats:
businessSeats,

first_seats:
firstSeats

}]);

if(error){

message.textContent=
"Could not create the flight.";

return;

}

location.replace(
"flights.html"
);

}

</script>

</body>
</html>
