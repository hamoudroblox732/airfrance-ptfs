<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Passenger Portal — AirFrance PTFS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#07090d;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh
}

header{
padding:18px;
background:#0c1118;
border-bottom:1px solid #202a35;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.logo{
font-size:20px;
font-weight:900
}

.verify{
color:#8491a1;
font-size:12px
}

.container{
max-width:1100px;
margin:auto;
padding:24px 16px 50px
}

.hero{
background:#0e141c;
border:1px solid #222d3a;
border-radius:20px;
padding:22px;
margin-bottom:20px
}

.hero h1{
margin:0;
font-size:30px
}

.hero p{
margin:8px 0 0;
color:#8995a5;
font-size:14px
}

.tabs{
display:flex;
gap:8px;
margin-bottom:18px;
overflow:auto
}

.tab{
border:1px solid #293442;
background:#111821;
color:#aeb8c5;
padding:11px 16px;
border-radius:10px;
font-weight:800;
cursor:pointer;
white-space:nowrap
}

.tab.active{
background:#1677ff;
border-color:#1677ff;
color:#fff
}

.panel{
display:none
}

.panel.active{
display:block
}

.flight-card{
background:#0e141c;
border:1px solid #222d3a;
border-radius:18px;
padding:18px;
margin-bottom:14px
}

.flight-top{
display:flex;
justify-content:space-between;
gap:15px
}

.flight-number{
font-size:22px;
font-weight:900
}

.route{
margin-top:5px;
font-size:14px;
color:#aeb8c5
}

.status{
padding:8px 11px;
border-radius:9px;
font-size:11px;
font-weight:900;
height:max-content
}

.scheduled{
background:#18202b;
color:#aeb8c5
}

.boarding{
background:#153a29;
color:#8fe0ad
}

.closed{
background:#332a17;
color:#e4c47d
}

.delayed{
background:#352916;
color:#e3bc70
}

.cancelled{
background:#3a181d;
color:#e09ca5
}

.departed,
.inflight,
.landed{
background:#182d45;
color:#9fc9f5
}

.info{
margin-top:16px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.info-box{
background:#090d13;
border:1px solid #202a35;
border-radius:11px;
padding:11px
}

.info-title{
font-size:10px;
color:#778493;
font-weight:800;
text-transform:uppercase
}

.info-value{
margin-top:5px;
font-size:13px;
font-weight:700
}

.class-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:14px
}

.class-box{
background:#090d13;
border:1px solid #202a35;
border-radius:12px;
padding:13px
}

.class-name{
font-size:13px;
font-weight:900
}

.seats{
margin-top:7px;
font-size:12px;
color:#aeb8c5
}

.class-time{
margin-top:7px;
font-size:11px;
color:#7f8d9d;
line-height:1.5
}

.class-access{
margin-top:7px;
font-size:10px;
font-weight:800
}

.access-open{
color:#75d99b
}

.access-locked{
color:#e4a0a8
}

.choose{
width:100%;
margin-top:15px;
padding:13px;
border:0;
border-radius:11px;
background:#1677ff;
color:#fff;
font-weight:900;
cursor:pointer
}

.choose:disabled{
background:#27313d;
color:#7e8996;
cursor:not-allowed
}

.booking-card{
background:#0e141c;
border:1px solid #222d3a;
border-radius:18px;
padding:20px;
margin-bottom:14px
}

.booking-title{
font-size:21px;
font-weight:900
}

.booking-line{
margin-top:10px;
color:#aeb8c5;
font-size:13px;
line-height:1.7
}

.empty{
background:#0e141c;
border:1px solid #222d3a;
border-radius:18px;
padding:35px;
text-align:center;
color:#8995a5
}

.server-box{
margin-top:16px;
background:#090d13;
border:1px solid #202a35;
border-radius:14px;
padding:15px
}

.server-title{
font-size:13px;
font-weight:900
}

.server-sub{
margin-top:6px;
color:#8995a5;
font-size:11px
}

.server-button{
display:block;
margin-top:12px;
padding:12px;
border-radius:10px;
background:#1677ff;
color:#fff;
text-decoration:none;
text-align:center;
font-weight:900
}

.server-wait{
margin-top:12px;
color:#8995a5;
font-size:12px
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
padding:16px;
z-index:20;
overflow:auto
}

.modal-box{
max-width:600px;
margin:5vh auto;
background:#0e141c;
border:1px solid #293442;
border-radius:20px;
padding:21px
}

.modal-box h2{
margin:0
}

.modal-sub{
color:#8995a5;
font-size:13px;
margin-top:7px
}

.classes{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-top:18px
}

.class-select{
background:#090d13;
border:1px solid #293442;
border-radius:11px;
padding:13px;
cursor:pointer
}

.class-select.selected{
border-color:#1677ff;
background:#10233c
}

.class-select.full,
.class-select.locked{
opacity:.45;
cursor:not-allowed
}

.class-select strong{
display:block;
font-size:13px
}

.class-select span{
display:block;
margin-top:5px;
font-size:11px;
color:#8995a5
}

.modal-info{
margin-top:15px;
background:#090d13;
border:1px solid #202a35;
border-radius:12px;
padding:14px;
font-size:13px;
line-height:1.7
}

.modal-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-top:15px
}

.confirm{
padding:13px;
border:0;
border-radius:11px;
background:#1677ff;
color:#fff;
font-weight:900
}

.confirm:disabled{
background:#27313d;
color:#7e8996
}

.close{
padding:13px;
border:0;
border-radius:11px;
background:#202a35;
color:#fff;
font-weight:900
}

.message{
margin-top:12px;
text-align:center;
font-size:12px;
color:#aeb8c5;
min-height:18px
}

@media(max-width:700px){

.info{
grid-template-columns:1fr
}

.class-grid{
grid-template-columns:1fr
}

.classes{
grid-template-columns:1fr
}

.flight-top{
flex-direction:column
}

.modal-actions{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="logo">
AirFrance PTFS
</div>

<div class="verify" id="passengerName">
Passenger
</div>

</header>

<div class="container">

<div class="hero">
<h1>Passenger Portal</h1>
<p>View flights, boarding times and manage your booking.</p>
</div>

<div class="tabs">

<button class="tab active" onclick="showPanel('flightsPanel',this)">
Flights
</button>

<button class="tab" onclick="showPanel('bookingPanel',this)">
My Booking
</button>

<button class="tab" onclick="showPanel('servicesPanel',this)">
Services
</button>

</div>

<div id="flightsPanel" class="panel active">

<div id="flights">
<div class="empty">Loading flights...</div>
</div>

</div>

<div id="bookingPanel" class="panel">

<div id="myBooking">
<div class="empty">Loading booking...</div>
</div>

</div>

<div id="servicesPanel" class="panel">

<div class="booking-card">

<div class="booking-title">
Passenger Services
</div>

<div class="booking-line">
Flight information, boarding times and booking management are available here.
</div>

</div>

</div>

</div>

<div class="modal" id="classModal">

<div class="modal-box">

<h2 id="modalFlight">
Choose Class
</h2>

<div class="modal-sub" id="modalRoute"></div>

<div class="classes" id="classChoices"></div>

<div class="modal-info" id="classInfo">
Select a class.
</div>

<div class="modal-actions">

<button
class="confirm"
id="confirmButton"
onclick="confirmBooking()"
disabled>
Confirm Booking
</button>

<button
class="close"
onclick="closeModal()">
Close
</button>

</div>

<div class="message" id="modalMessage"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL=
"https://pjsadqfyvibsjrccnaum.supabase.co";

const SUPABASE_KEY=
"sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const db=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const passenger=
localStorage.getItem(
"af_passenger"
);

if(!passenger){

location.replace(
"verify.html"
);

}

document
.getElementById("passengerName")
.textContent=
passenger||"Passenger";

let selectedFlight=null;
let selectedClass=null;

let classSettings={
Business:false,
First:false
};

let classPermissions={
Business:false,
First:false
};

async function loadClassAccess(){

const {
data:settings
}=
await db
.from("class_settings")
.select("*");

if(settings){

settings.forEach(
function(item){

if(
item.class_name==="Business"
){

classSettings.Business=
item.open_to_all;

}

if(
item.class_name==="First"
){

classSettings.First=
item.open_to_all;

}

}
);

}

const {
data:permissions
}=
await db
.from("class_permissions")
.select("*")
.eq(
"username",
passenger
);

if(permissions){

permissions.forEach(
function(item){

if(
item.class_name==="Business"
){

classPermissions.Business=true;

}

if(
item.class_name==="First"
){

classPermissions.First=true;

}

}
);

}

}

function hasClassAccess(className){

if(className==="Economy"){
return true;
}

return Boolean(
classSettings[className]||
classPermissions[className]
);

}

function showPanel(
id,
button
){

document
.querySelectorAll(".panel")
.forEach(
function(panel){
panel.classList.remove("active");
}
);

document
.querySelectorAll(".tab")
.forEach(
function(tab){
tab.classList.remove("active");
}
);

document
.getElementById(id)
.classList.add("active");

button.classList.add("active");

if(id==="bookingPanel"){
loadBookings();
}

}

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function formatDate(value){

if(!value){
return"Not set";
}

return new Date(value).toLocaleString([],{
year:"numeric",
month:"short",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
});

}

function getStatus(flight){

if(flight.status==="Cancelled"){
return"Cancelled";
}

if(flight.status==="Delayed"){
return"Delayed";
}

if(flight.status==="Landed"){
return"Landed";
}

if(flight.status==="In Flight"){
return"In Flight";
}

if(flight.status==="Departed"){
return"Departed";
}

if(flight.closed){

if(
flight.departure_time&&
new Date()>=new Date(
flight.departure_time
)
){

return"Departed";

}

return"Closed";

}

if(
!flight.boarding_time||
!flight.departure_time
){

return flight.status||
"Scheduled";

}

const now=
new Date();

const boarding=
new Date(
flight.boarding_time
);

const departure=
new Date(
flight.departure_time
);

if(now<boarding){
return"Scheduled";
}

if(
now>=boarding&&
now<departure
){

return"Boarding";

}

if(now>=departure){
return"Departed";
}

return"Scheduled";

}

function statusClass(status){

if(status==="Boarding"){
return"status boarding";
}

if(status==="Closed"){
return"status closed";
}

if(status==="Delayed"){
return"status delayed";
}

if(status==="Cancelled"){
return"status cancelled";
}

if(status==="Departed"){
return"status departed";
}

if(status==="In Flight"){
return"status inflight";
}

if(status==="Landed"){
return"status landed";
}

return"status scheduled";

}

function getCapacity(
flight,
className
){

if(className==="Economy"){
return Number(
flight.economy_seats||0
);
}

if(className==="Business"){
return Number(
flight.business_seats||0
);
}

if(className==="First"){
return Number(
flight.first_seats||0
);
}

return 0;

}

function getBoardingTime(
flight,
className
){

if(className==="Economy"){
return flight.economy_boarding_time;
}

if(className==="Business"){
return flight.business_boarding_time;
}

if(className==="First"){
return flight.first_boarding_time;
}

return null;

}

async function getBookedCount(
flightId,
className
){

const {
count,
error
}=
await db
.from("bookings")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq(
"flight_id",
flightId
)
.eq(
"class",
className
);

if(error){
return 0;
}

return count||0;

}

function isClassBoardingOpen(
flight,
className
){

const status=
getStatus(flight);

if(
status==="Closed"||
status==="Cancelled"||
status==="Departed"||
status==="In Flight"||
status==="Landed"
){

return false;

}

const time=
getBoardingTime(
flight,
className
);

if(!time){
return false;
}

return new Date()>=
new Date(time);

}

async function getClassState(
flight,
className
){

if(
!hasClassAccess(className)
){

return{
state:"locked",
booked:0,
remaining:
getCapacity(
flight,
className
)
};

}

const capacity=
getCapacity(
flight,
className
);

const booked=
await getBookedCount(
flight.id,
className
);

if(capacity<=booked){

return{
state:"full",
booked:booked,
remaining:0
};

}

if(
!isClassBoardingOpen(
flight,
className
)
){

return{
state:"waiting",
booked:booked,
remaining:
capacity-booked
};

}

return{
state:"open",
booked:booked,
remaining:
capacity-booked
};

}

async function loadFlights(){

await loadClassAccess();

const box=
document.getElementById(
"flights"
);

const {
data,
error
}=
await db
.from("flights")
.select("*")
.order(
"departure_time",
{
ascending:true
}
);

if(error){

box.innerHTML=
'<div class="empty">Could not load flights.</div>';

return;

}

if(
!data||
data.length===0
){

box.innerHTML=
'<div class="empty">No flights available.</div>';

return;

}

box.innerHTML="";

for(
const flight of data
){

const status=
getStatus(flight);

const card=
document.createElement(
"div"
);

card.className=
"flight-card";

const classes=
[
"Economy",
"Business",
"First"
];

let classHtml="";

for(
const className of classes
){

const capacity=
getCapacity(
flight,
className
);

const booked=
await getBookedCount(
flight.id,
className
);

const remaining=
Math.max(
capacity-booked,
0
);

const boardingTime=
getBoardingTime(
flight,
className
);

const access=
hasClassAccess(
className
);

let accessText=
"Available";

let accessClass=
"access-open";

if(
className!=="Economy"&&
!access
){

accessText=
"Restricted";
accessClass=
"access-locked";

}

classHtml+=

'<div class="class-box">'+

'<div class="class-name">'+
className+
'</div>'+

'<div class="seats">'+
remaining+
' / '+
capacity+
' seats available'+
'</div>'+

'<div class="class-time">'+
'Boarding: '+
escapeHtml(
formatDate(
boardingTime
)
)+
'</div>'+

'<div class="class-access '+
accessClass+
'">'+
accessText+
'</div>'+

'</div>';

}

const canChoose=
status==="Scheduled"||
status==="Boarding";

card.innerHTML=

'<div class="flight-top">'+

'<div>'+

'<div class="flight-number">'+
escapeHtml(
flight.flight_number
)+
'</div>'+

'<div class="route">'+
escapeHtml(
flight.departure
)+
' → '+
escapeHtml(
flight.destination
)+
'</div>'+

'</div>'+

'<div class="'+
statusClass(status)+
'">'+
escapeHtml(status)+
'</div>'+

'</div>'+

'<div class="info">'+

'<div class="info-box">'+
'<div class="info-title">Aircraft</div>'+
'<div class="info-value">'+
escapeHtml(flight.aircraft)+
'</div>'+
'</div>'+

'<div class="info-box">'+
'<div class="info-title">Pilot</div>'+
'<div class="info-value">'+
escapeHtml(
flight.pilot||
"Not assigned"
)+
'</div>'+
'</div>'+

'<div class="info-box">'+
'<div class="info-title">Final Boarding</div>'+
'<div class="info-value">'+
escapeHtml(
formatDate(
flight.boarding_time
)
)+
'</div>'+
'</div>'+

'<div class="info-box">'+
'<div class="info-title">Departure</div>'+
'<div class="info-value">'+
escapeHtml(
formatDate(
flight.departure_time
)
)+
'</div>'+
'</div>'+

'</div>'+

'<div class="class-grid">'+
classHtml+
'</div>'+

'<button class="choose" '+
(canChoose?"":"disabled")+
'>'+
(
canChoose?
"Choose Class":
"Booking Closed"
)+
'</button>';

if(canChoose){

card
.querySelector(".choose")
.addEventListener(
"click",
function(){
openClassModal(flight);
}
);

}

box.appendChild(card);

}

}

async function openClassModal(
flight
){

await loadClassAccess();

selectedFlight=
flight;

selectedClass=
null;

document
.getElementById(
"modalFlight"
)
.textContent=
flight.flight_number;

document
.getElementById(
"modalRoute"
)
.textContent=
flight.departure+
" → "+
flight.destination;

document
.getElementById(
"classInfo"
)
.textContent=
"Select a class.";

document
.getElementById(
"confirmButton"
)
.disabled=true;

document
.getElementById(
"modalMessage"
)
.textContent="";

const choices=
document.getElementById(
"classChoices"
);

choices.innerHTML="";

for(
const className of
[
"Economy",
"Business",
"First"
]
){

const state=
await getClassState(
flight,
className
);

const button=
document.createElement(
"div"
);

button.className=
"class-select";

if(state.state==="full"){
button.classList.add("full");
}

if(state.state==="locked"){
button.classList.add("locked");
}

let stateText=
state.remaining+
" seats available";

if(state.state==="full"){
stateText=
"Class Full";
}

if(state.state==="locked"){
stateText=
"Restricted — Owner access required";
}

if(state.state==="waiting"){

stateText=
"Boarding: "+
formatDate(
getBoardingTime(
flight,
className
)
);

}

button.innerHTML=
'<strong>'+
className+
'</strong>'+
'<span>'+
escapeHtml(stateText)+
'</span>';

if(
state.state!=="full"&&
state.state!=="locked"
){

button.addEventListener(
"click",
function(){

document
.querySelectorAll(
".class-select"
)
.forEach(
function(item){
item.classList.remove(
"selected"
);
}
);

button.classList.add(
"selected"
);

selectedClass=
className;

updateClassInfo();

}
);

}

choices.appendChild(button);

}

document
.getElementById(
"classModal"
)
.style.display=
"block";

}

async function updateClassInfo(){

if(
!selectedFlight||
!selectedClass
){

return;

}

const info=
document.getElementById(
"classInfo"
);

const confirm=
document.getElementById(
"confirmButton"
);

if(
!hasClassAccess(selectedClass)
){

info.textContent=
"You do not have access to this class.";

confirm.disabled=true;

return;

}

const state=
await getClassState(
selectedFlight,
selectedClass
);

const status=
getStatus(
selectedFlight
);

if(
status==="Closed"||
status==="Cancelled"||
status==="Departed"||
status==="In Flight"||
status==="Landed"
){

info.textContent=
"Booking is closed for this flight.";

confirm.disabled=true;

return;

}

if(state.state==="full"){

info.textContent=
selectedClass+
" is full.";

confirm.disabled=true;

return;

}

if(state.state==="waiting"){

info.textContent=
selectedClass+
" boarding starts at "+
formatDate(
getBoardingTime(
selectedFlight,
selectedClass
)
)+
". You cannot book yet.";

confirm.disabled=true;

return;

}

info.textContent=
selectedClass+
" is open. "+
state.remaining+
" seats remaining.";

confirm.disabled=false;

}

async function confirmBooking(){

const message=
document.getElementById(
"modalMessage"
);

if(
!selectedFlight||
!selectedClass
){

return;

}

if(
!hasClassAccess(selectedClass)
){

message.textContent=
"You do not have access to this class.";

return;

}

const status=
getStatus(
selectedFlight
);

if(
status==="Closed"||
status==="Cancelled"||
status==="Departed"||
status==="In Flight"||
status==="Landed"
){

message.textContent=
"Booking is closed.";

return;

}

const {
data:existing
}=
await db
.from("bookings")
.select("id")
.eq(
"passenger",
passenger
)
.eq(
"flight_id",
selectedFlight.id
)
.maybeSingle();

if(existing){

message.textContent=
"You already have a booking for this flight.";

return;

}

const state=
await getClassState(
selectedFlight,
selectedClass
);

if(state.state!=="open"){

message.textContent=
"The selected class is not available.";

updateClassInfo();

return;

}

message.textContent=
"Booking...";

const {
error
}=
await db
.from("bookings")
.insert({

flight_id:
selectedFlight.id,

passenger:
passenger,

class:
selectedClass

});

if(error){

message.textContent=
"Could not create booking.";

return;

}

message.textContent=
"Booking confirmed.";

setTimeout(
function(){

closeModal();

loadFlights();

loadBookings();

},
700
);

}

function getRobloxLink(
value
){

if(!value){
return null;
}

try{

const url=
new URL(value);

if(
url.protocol!=="http:"&&
url.protocol!=="https:"
){

return null;

}

if(
!url.hostname.toLowerCase().includes(
"roblox.com"
)
){

return null;

}

return url.href;

}catch{

return null;

}

}

function createServerBox(
flight
){

const box=
document.createElement(
"div"
);

box.className=
"server-box";

const title=
document.createElement(
"div"
);

title.className=
"server-title";

title.textContent=
"Roblox Flight Server";

box.appendChild(title);

const sub=
document.createElement(
"div"
);

sub.className=
"server-sub";

sub.textContent=
"Your ticket gives you access to the flight server.";

box.appendChild(sub);

const link=
getRobloxLink(
flight.server_link
);

if(link){

const button=
document.createElement(
"a"
);

button.className=
"server-button";

button.href=
link;

button.target="_blank";

button.rel=
"noopener noreferrer";

button.textContent=
"Join Roblox Server";

box.appendChild(button);

}else{

const wait=
document.createElement(
"div"
);

wait.className=
"server-wait";

wait.textContent=
"The pilot has not added the server link yet.";

box.appendChild(wait);

}

return box;

}

function closeModal(){

document
.getElementById(
"classModal"
)
.style.display=
"none";

selectedFlight=null;
selectedClass=null;

}

async function loadBookings(){

const box=
document.getElementById(
"myBooking"
);

const {
data,
error
}=
await db
.from("bookings")
.select(
"*, flights(*)"
)
.eq(
"passenger",
passenger
)
.order(
"created_at",
{
ascending:false
}
);

if(error){

box.innerHTML=
'<div class="empty">Could not load booking.</div>';

return;

}

if(
!data||
data.length===0
){

box.innerHTML=
'<div class="empty">You have no booking.</div>';

return;

}

box.innerHTML="";

data.forEach(
function(booking){

const flight=
booking.flights;

if(!flight){
return;
}

const status=
getStatus(flight);

const card=
document.createElement(
"div"
);

card.className=
"booking-card";

card.innerHTML=

'<div class="booking-title">'+
escapeHtml(
flight.flight_number
)+
'</div>'+

'<div class="booking-line">'+

'<strong>Route:</strong> '+
escapeHtml(
flight.departure
)+
' → '+
escapeHtml(
flight.destination
)+
'<br>'+

'<strong>Class:</strong> '+
escapeHtml(
booking.class
)+
'<br>'+

'<strong>Aircraft:</strong> '+
escapeHtml(
flight.aircraft
)+
'<br>'+

'<strong>Class Boarding:</strong> '+
escapeHtml(
formatDate(
getBoardingTime(
flight,
booking.class
)
)
)+
'<br>'+

'<strong>Final Boarding:</strong> '+
escapeHtml(
formatDate(
flight.boarding_time
)
)+
'<br>'+

'<strong>Departure:</strong> '+
escapeHtml(
formatDate(
flight.departure_time
)
)+
'<br>'+

'<strong>Status:</strong> '+
escapeHtml(status)+

'</div>';

card.appendChild(
createServerBox(flight)
);

box.appendChild(card);

}
);

}

window.addEventListener(
"click",
function(event){

const modal=
document.getElementById(
"classModal"
);

if(
event.target===modal
){

closeModal();

}

});

loadClassAccess();
loadFlights();
loadBookings();

setInterval(
function(){

loadClassAccess();
loadFlights();
loadBookings();

},
30000
);

</script>

</body>
</html>
