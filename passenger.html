<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS Passenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#05080d;color:#fff;min-height:100vh}
header{height:72px;background:#080d14;border-bottom:1px solid #202d3b;display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.logo{font-size:21px;font-weight:900}.user{font-size:10px;color:#9ab5d5}
main{max-width:1200px;margin:auto;padding:35px 20px}
.hero{background:linear-gradient(135deg,#101a26,#080d13);border:1px solid #223143;border-radius:22px;padding:35px;margin-bottom:18px}
.hero small{color:#6380a0}.hero h1{font-size:32px;margin:10px 0}.hero p{color:#778595;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#0b1219;border:1px solid #202d3b;border-radius:17px;padding:20px}
.card h2{font-size:15px;margin-bottom:8px}.card p{font-size:11px;color:#778595;line-height:1.7}
button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:11px 15px;margin-top:15px;font-weight:bold}
footer{text-align:center;color:#40505f;padding:35px;font-size:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo">AirFrance PTFS</div>
<div class="user" id="user"></div>
</header>

<main>
<div class="hero">
<small>PASSENGER PORTAL</small>
<h1>مرحبًا بك في AirFrance PTFS</h1>
<p>من هنا يمكنك الوصول إلى خدمات المسافر ومعلومات الرحلات.</p>
</div>

<div class="grid">
<div class="card"><h2>Flights</h2><p>عرض الرحلات المتاحة.</p><button>فتح</button></div>
<div class="card"><h2>My Booking</h2><p>متابعة حجوزاتك.</p><button>فتح</button></div>
<div class="card"><h2>Passenger Services</h2><p>خدمات ومعلومات المسافر.</p><button>فتح</button></div>
</div>

<button onclick="logout()">تسجيل الخروج</button>
</main>

<footer>HAMOUD • AirFrance PTFS</footer>

<script>
const user=sessionStorage.getItem("af_passenger");
if(!user)location.href="verify.html";
document.getElementById("user").textContent=user||"";
function logout(){sessionStorage.removeItem("af_passenger");location.href="index.html"}
</script>
</body>
</html>
