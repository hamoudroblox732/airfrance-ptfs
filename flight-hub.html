<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirFrance PTFS — Flight Hub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#182334;
min-height:100vh
}

.layout{display:flex;min-height:100vh}

.sidebar{
width:245px;
background:#fff;
border-right:1px solid #e4e8ef;
padding:22px 15px;
position:fixed;
inset:0 auto 0 0
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-weight:800;
font-size:19px;
padding:8px 10px 28px
}

.brand-icon{
width:38px;
height:38px;
border-radius:10px;
background:#123b73;
color:white;
display:flex;
align-items:center;
justify-content:center
}

.label{
font-size:10px;
font-weight:800;
color:#98a1b1;
letter-spacing:1px;
padding:14px 11px 7px
}

nav{
display:grid;
gap:5px
}

nav button{
border:0;
background:transparent;
padding:12px;
border-radius:9px;
text-align:left;
font-weight:700;
color:#697386;
cursor:pointer
}

nav button:hover,
nav button.active{
background:#eaf1fb;
color:#123b73
}

.content{
margin-left:245px;
width:calc(100% - 245px);
padding:28px
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px
}

.title{
font-size:27px;
font-weight:800
}

.subtitle{
font-size:13px;
color:#8b95a5;
margin-top:5px
}

.user{
background:white;
border:1px solid #e4e8ef;
border-radius:9px;
padding:10px 14px;
font-size:12px;
font-weight:700
}

.toolbar{
display:flex;
gap:10px;
margin-bottom:18px;
flex-wrap:wrap
}

.search{
flex:1;
min-width:190px;
border:1px solid #dfe4eb;
background:white;
border-radius:10px;
padding:12px 14px;
outline:none
}

.filter{
border:1px solid #dfe4eb;
background:white;
border-radius:10px;
padding:12px 15px;
font-weight:700;
color:#536075
}

.refresh{
border:0;
background:#123b73;
color:white;
border-radius:10px;
padding:12px 17px;
font-weight:800;
cursor:pointer
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px
}

.flight{
background:white;
border:1px solid #e4e8ef;
border-radius:15px;
padding:20px
}

.flight-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px
}

.number{
font-size:18px;
font-weight:900
}

.status{
font-size:10px;
font-weight:900;
padding:6px 9px;
border-radius:7px;
background:#edf7f0;
color:#287343
}

.route{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:12px;
margin-bottom:18px
}

.airport{
font-size:25px;
font-weight:900
}

.city{
font-size:11px;
color:#8b95a5;
margin-top:3px
}

.arrow{
color:#9ba5b5;
font-size:18px
}

.right{text-align:right}

.info{
border-top:1px solid #edf0f4;
padding-top:15px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.info-box{
background:#f7f9fc;
border-radius:9px;
padding:10px
}

.info-label{
font-size:9px;
font-weight:800;
color:#9aa3b1;
text-transform:uppercase
}

.info-value{
font-size:12px;
font-weight:800;
margin-top:4px
}

.open{
width:100%;
margin-top:15px;
border:1px solid #dce3ed;
background:#fff;
color:#123b73;
border-radius:9px;
padding:11px;
font-weight:800;
cursor:pointer
}

.open:hover{
background:#f3f7fc
}

.empty{
grid-column:1/-1;
background:white;
border:1px solid #e4e8ef;
border-radius:15px;
padding:45px;
text-align:center;
color:#8b95a5
}

@media(max-width:800px){
.sidebar{
position:relative;
width:210px
}

.content{
margin-left:210px;
width:calc(100% - 210px)
}

.grid{
grid-template-columns:1fr
}
}

@media(max-width:600px){
.layout{display:block}

.sidebar{
width:100%;
height:auto;
border-right:0;
border-bottom:1px solid #e4e8ef
}

.content{
margin:0;
width:100%;
padding:18px
}

.header{
align-items:flex-start
}

.user{
display:none
}

.grid{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="brand">
<div class="brand-icon">AF</div>
AirFrance PTFS
</div>

<div class="label">MAIN</div>

<nav>
<button onclick="location.href='index.html'">Dashboard</button>
<button class="active" onclick="location.href='flight-hub.html'">Flight Hub</button>
<button onclick="location.href='passenger.html'">Passenger</button>
</nav>

<div class="label">OPERATIONS</div>

<nav>
<button onclick="location.href='staff.html'">Crew Portal</button>
<button onclick="location.href='create-flight.html'">Create Flight</button>
</nav>

<div class="label">ACCOUNT</div>

<nav>
<button onclick="logout()">Logout</button>
</nav>

</aside>

<main class="content">

<header class="header">

<div>
<div class="title">Flight Hub</div>
<div class="subtitle">
Live AirFrance PTFS flight operations
</div>
</div>

<div class="user" id="user">
Guest
</div>

</header>

<div class="toolbar">

<input
class="search"
id="search"
placeholder="Search flight number or route..."
oninput="render()"
>

<select class="filter" id="filter" onchange="render()">
<option value="All">All Flights</option>
<option value="Scheduled">Scheduled</option>
<option value="Boarding">Boarding</option>
<option value="Closed">Closed</option>
<option value="Delayed">Delayed</option>
<option value="Departed">Departed</option>
<option value="In Flight">In Flight</option>
<option value="Landed">Landed</option>
<option value="Cancelled">Cancelled</option>
</select>

<button class="refresh" onclick="loadFlights()">
Refresh
</button>

</div>

<div class="grid" id="flights">

<div class="empty">
Loading flights...
</div>

</div>

</main>

</div>

<script>

const SUPABASE_URL="https://pjsadqfyvibsjrccnaum.supabase.co";
const SUPABASE_KEY="sb_publishable_HKBI1QKk53w8Vp8Eq23X-A_gmrUk1px";

const username=sessionStorage.getItem("af_user");

if(username){
document.getElementById("user").textContent=username;
}

let flights=[];

async function loadFlights(){

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/flights?select=*&order=created_at.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);

if(!response.ok){
throw new Error("Failed");
}

flights=await response.json();

render();

}catch(error){

document.getElementById("flights").innerHTML=`
<div class="empty">
Unable to load flights.
</div>
`;

}

}

function render(){

const search=document
.getElementById("search")
.value
.toLowerCase()
.trim();

const filter=document
.getElementById("filter")
.value;

const filtered=flights.filter(f=>{

const text=(
(f.flight_number||"")+" "+
(f.departure||"")+" "+
(f.destination||"")+" "+
(f.aircraft||"")
).toLowerCase();

const matchesSearch=!search||text.includes(search);

const matchesFilter=
filter==="All"||f.status===filter;

return matchesSearch&&matchesFilter;

});

if(!filtered.length){

document.getElementById("flights").innerHTML=`
<div class="empty">
No flights found.
</div>
`;

return;
}

document.getElementById("flights").innerHTML=
filtered.map(f=>{

return `
<div class="flight">

<div class="flight-top">

<div class="number">
${safe(f.flight_number||"Unknown")}
</div>

<div class="status">
${safe(f.status||"Scheduled")}
</div>

</div>

<div class="route">

<div>
<div class="airport">
${safe(f.departure||"—")}
</div>
<div class="city">
Departure
</div>
</div>

<div class="arrow">→</div>

<div class="right">
<div class="airport">
${safe(f.destination||"—")}
</div>
<div class="city">
Destination
</div>
</div>

</div>

<div class="info">

<div class="info-box">
<div class="info-label">Aircraft</div>
<div class="info-value">
${safe(f.aircraft||"—")}
</div>
</div>

<div class="info-box">
<div class="info-label">Pilot</div>
<div class="info-value">
${safe(f.pilot||"Not assigned")}
</div>
</div>

<div class="info-box">
<div class="info-label">Boarding</div>
<div class="info-value">
${formatDate(f.boarding_time)}
</div>
</div>

<div class="info-box">
<div class="info-label">Departure</div>
<div class="info-value">
${formatDate(f.departure_time)}
</div>
</div>

</div>

<button
class="open"
onclick="openFlight(${Number(f.id)})"
>
View Flight
</button>

</div>
`;

}).join("");

}

function openFlight(id){

sessionStorage.setItem(
"af_selected_flight",
String(id)
);

window.location.href="flight-details.html";

}

function formatDate(value){

if(!value)return"—";

const date=new Date(value);

if(Number.isNaN(date.getTime()))return"—";

return date.toLocaleString(
"en-SA",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}

function safe(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function logout(){

sessionStorage.clear();
localStorage.removeItem("af_passenger");

location.href="employee.html";

}

loadFlights();

setInterval(loadFlights,30000);

</script>

</body>
</html>
